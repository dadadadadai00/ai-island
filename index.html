<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>カイロ風ダイヤモンドマップ</title>
  <style>
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
    body {
      margin: 0;
      background: #181926;
      color: #cad3f5;
      font-family: sans-serif;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 16px 8px;
    }
    h2 { margin: 0 0 4px; font-size: 17px; color: #8aadf4; }
    .subtitle { font-size: 12px; color: #a5adcb; margin-bottom: 10px; }
    
    .status-panel {
      background: #24273a;
      border: 1px solid #363a4f;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: bold;
      color: #eed49f;
      margin-bottom: 10px;
    }

    /* 3Dステージ */
    .viewport {
      width: 100%;
      max-width: 400px;
      height: 420px;
      display: flex;
      justify-content: center;
      align-items: center;
      perspective: 1200px;
      overflow: hidden;
      background: radial-gradient(circle at center, #1e2030 0%, #11121d 100%);
      border-radius: 16px;
      border: 1px solid #363a4f;
    }

    /* ダイヤモンドグリッド（斜め45度・傾斜60度） */
    .iso-map {
      display: grid;
      grid-template-columns: repeat(10, 26px);
      grid-template-rows: repeat(10, 26px);
      gap: 3px;
      transform: rotateX(60deg) rotateZ(-45deg);
      transform-style: preserve-3d;
      padding: 20px;
      position: relative;
    }

    /* タイル（おもちゃ風クリーン立体） */
    .tile {
      width: 26px;
      height: 26px;
      background: linear-gradient(135deg, #a6da95, #8bd5ca);
      border-radius: 6px;
      box-shadow: 0 4px 0 #5b8266, 0 6px 8px rgba(0,0,0,0.3);
      cursor: pointer;
      transition: transform 0.15s, background 0.15s, box-shadow 0.15s;
    }
    .tile.water {
      background: linear-gradient(135deg, #7dc4e4, #91d7e3);
      box-shadow: 0 3px 0 #3a708c, 0 5px 8px rgba(0,0,0,0.3);
    }
    .tile.mountain {
      background: linear-gradient(135deg, #ee99a0, #ed8796);
      box-shadow: 0 5px 0 #9f5360, 0 8px 10px rgba(0,0,0,0.3);
      transform: translateZ(4px);
    }
    .tile:active, .tile.selected {
      background: #eed49f !important;
      box-shadow: 0 8px 0 #c6a052, 0 12px 14px rgba(0,0,0,0.4) !important;
      transform: translateZ(8px) !important;
    }

    /* スルスル動くキャラクター */
    #chara {
      position: absolute;
      width: 26px;
      height: 26px;
      font-size: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      z-index: 50;
      transform: translateZ(12px) rotateZ(45deg) rotateX(-60deg);
      transition: left 0.3s cubic-bezier(0.25, 1, 0.5, 1), top 0.3s cubic-bezier(0.25, 1, 0.5, 1);
      filter: drop-shadow(0 6px 3px rgba(0,0,0,0.4));
    }
  </style>
</head>
<body>

  <h2>🏝 カイロ風 ダイヤモンドマップ</h2>
  <div class="subtitle">マスをタップするとロボがスルスル歩きます</div>
  <div class="status-panel" id="status">選択座標: なし</div>

  <div class="viewport">
    <div class="iso-map" id="map">
      <div id="chara">🤖</div>
    </div>
  </div>

  <script>
    const MAP_SIZE = 10;
    const mapEl = document.getElementById('map');
    const statusEl = document.getElementById('status');
    const charaEl = document.getElementById('chara');

    let selectedTile = null;

    // 10x10 マップ生成
    for (let y = 0; y < MAP_SIZE; y++) {
      for (let x = 0; x < MAP_SIZE; x++) {
        const tile = document.createElement('div');
        tile.className = 'tile';
        
        // アクセント（水辺と小山）
        if ((x === 0 || y === 0 || x === 9 || y === 9) && (x + y) % 3 === 0) {
          tile.classList.add('water');
        } else if ((x === 2 && y === 3) || (x === 7 && y === 6)) {
          tile.classList.add('mountain');
        }

        tile.onclick = () => onTileClick(x, y, tile);
        mapEl.appendChild(tile);
      }
    }

    function onTileClick(x, y, el) {
      if (selectedTile) selectedTile.classList.remove('selected');
      selectedTile = el;
      el.classList.add('selected');

      statusEl.innerText = `選択座標: (${x}, ${y}) へ移動中！`;
      moveChara(x, y);
    }

    function moveChara(x, y) {
      const step = 29; // 1マス 26px + 隙間 3px
      const left = 20 + x * step;
      const top = 20 + y * step;
      charaEl.style.left = `${left}px`;
      charaEl.style.top = `${top}px`;
    }

    // 初期配置 (5, 5)
    moveChara(5, 5);
  </script>
</body>
</html>
