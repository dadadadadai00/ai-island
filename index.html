<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI箱庭アイランド</title>
  <style>
    :root { --cell-size: 46px; }
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; margin: 12px; background: #18181f; color: #f0f0f0; }
    
    /* ヘッダー */
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .header h2 { margin: 0; font-size: 20px; font-weight: bold; }
    .gear-btn { background: #2b2b36; border: 1px solid #444; color: #fff; font-size: 18px; padding: 6px 12px; border-radius: 8px; cursor: pointer; }

    /* 操作パネル */
    .panel { background: #24242e; padding: 12px; border-radius: 8px; margin-bottom: 12px; border: 1px solid #333; }
    .status { font-size: 13px; color: #fbbf24; margin-bottom: 8px; min-height: 20px; word-break: break-all; font-weight: 500; }
    .btn-group { display: flex; gap: 6px; flex-wrap: wrap; }
    button.main-btn { flex: 2; min-width: 120px; padding: 10px; background: #4f46e5; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
    button.sub-btn { flex: 1; min-width: 70px; padding: 10px; background: #374151; color: white; border: none; border-radius: 6px; cursor: pointer; }

    /* マップ表示（上下を広く拡張） */
    #world-container {
      min-height: 320px;
      max-height: 55vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f0f14;
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 12px;
      overflow: auto;
      border: 1px solid #2a2a35;
    }
    #grid { display: grid; gap: 4px; }
    .cell { width: var(--cell-size); height: var(--cell-size); background: #2d5a37; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 22px; box-shadow: inset 0 0 4px rgba(0,0,0,0.3); }

    /* AIの手帳 */
    h3 { margin: 0 0 8px 0; font-size: 15px; color: #9ca3af; }
    textarea { width: 100%; height: 70px; background: #141419; border: 1px solid #3b3b48; color: #a7f3d0; font-family: monospace; font-size: 13px; border-radius: 6px; padding: 8px; resize: none; }

    /* 思考ログ履歴 */
    .log-container { max-height: 220px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
    .log-item { background: #1a1a22; padding: 8px 10px; border-radius: 6px; border-left: 3px solid #4f46e5; font-size: 12px; }
    .log-header { display: flex; justify-content: space-between; color: #818cf8; margin-bottom: 4px; font-weight: bold; }
    .log-thought { color: #d1d5db; margin-bottom: 2px; }
    .log-memo { color: #6ee7b7; font-family: monospace; }

    /* 設定モーダル */
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); justify-content: center; align-items: center; z-index: 100; padding: 16px; }
    .modal-content { background: #24242e; width: 100%; max-width: 360px; padding: 18px; border-radius: 10px; border: 1px solid #444; }
    .modal-content h3 { color: #fff; font-size: 16px; margin-bottom: 12px; }
    .modal-content input { width: 100%; padding: 10px; background: #141419; border: 1px solid #444; color: #fff; border-radius: 6px; margin-bottom: 12px; }
    .modal-actions { display: flex; gap: 8px; }
    .modal-actions button { flex: 1; padding: 10px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
    .modal-save { background: #4f46e5; color: white; }
    .modal-close { background: #4b5563; color: white; }
  </style>
</head>
<body>

  <!-- ヘッダー（歯車アイコン） -->
  <div class="header">
    <h2>🏝 AI箱庭アイランド</h2>
    <button class="gear-btn" onclick="openSettings()">⚙ 設定</button>
  </div>

  <!-- 操作盤 -->
  <div class="panel">
    <div class="status" id="statusText">待機中</div>
    <div class="btn-group">
      <button class="main-btn" onclick="thinkAndAct()">今すぐ考えさせる</button>
      <button class="sub-btn" onclick="expandLand()">土地拡張</button>
      <button class="sub-btn" onclick="addItem('木')">🌲 木</button>
      <button class="sub-btn" onclick="addItem('石')">🪨 石</button>
    </div>
  </div>

  <!-- マップ（拡大エリア） -->
  <div id="world-container">
    <div id="grid"></div>
  </div>

  <!-- 現在の手帳 -->
  <div class="panel">
    <h3>現在のAI手帳（短期記憶）</h3>
    <textarea id="notebook" readonly></textarea>
  </div>

  <!-- 過去の思考履歴 -->
  <div class="panel">
    <h3>過去の行動・思考履歴</h3>
    <div class="log-container" id="logContainer">
      <div style="font-size: 12px; color: #6b7280;">まだ履歴はありません。</div>
    </div>
  </div>

  <!-- 設定モーダル（APIキー入力） -->
  <div class="modal-overlay" id="settingsModal">
    <div class="modal-content">
      <h3>API設定</h3>
      <label style="font-size: 12px; color: #9ca3af; display: block; margin-bottom: 4px;">Gemini APIキー</label>
      <input type="password" id="modalApiKey" placeholder="AIzaSy...">
      <div class="modal-actions">
        <button class="modal-save" onclick="saveKeyFromModal()">保存</button>
        <button class="modal-close" onclick="closeSettings()">閉じる</button>
      </div>
    </div>
  </div>

  <script>
    let state = {
      size: 2,
      agent: { x: 0, y: 0, icon: "🤖" },
      items: [],
      notebook: "ここは2x2の小さな島だ。何も知らない。",
      logs: []
    };

    const itemTypes = {
      '木': { icon: '🌲', name: '木' },
      '石': { icon: '🪨', name: '石' }
    };

    window.onload = () => {
      const savedKey = localStorage.getItem('gemini_api_key');
      if (savedKey) document.getElementById('modalApiKey').value = savedKey;
      renderGrid();
    };

    function openSettings() {
      document.getElementById('settingsModal').style.display = 'flex';
    }

    function closeSettings() {
      document.getElementById('settingsModal').style.display = 'none';
    }

    function saveKeyFromModal() {
      const key = document.getElementById('modalApiKey').value.trim();
      localStorage.setItem('gemini_api_key', key);
      closeSettings();
      setStatus(key ? "APIキーを保存しました" : "APIキーが未入力です");
    }

    function expandLand() {
      if (state.size >= 6) return alert("プロトタイプ版の上限（6x6）です");
      state.size++;
      renderGrid();
      setStatus(`土地が ${state.size}x${state.size} に広がりました`);
    }

    function addItem(type) {
      let emptySpots = [];
      for (let y = 0; y < state.size; y++) {
        for (let x = 0; x < state.size; x++) {
          if ((x !== state.agent.x || y !== state.agent.y) && !state.items.find(i => i.x === x && i.y === y)) {
            emptySpots.push({ x, y });
          }
        }
      }
      if (emptySpots.length === 0) return alert("置く場所がありません");
      const spot = emptySpots[Math.floor(Math.random() * emptySpots.length)];
      state.items.push({
        id: Date.now(),
        name: itemTypes[type].name,
        icon: itemTypes[type].icon,
        x: spot.x,
        y: spot.y
      });
      renderGrid();
      setStatus(`土地に【${type}】を追加しました`);
    }

    function renderGrid() {
      const grid = document.getElementById('grid');
      grid.style.gridTemplateColumns = `repeat(${state.size}, var(--cell-size))`;
      grid.innerHTML = '';

      for (let y = 0; y < state.size; y++) {
        for (let x = 0; x < state.size; x++) {
          const cell = document.createElement('div');
          cell.className = 'cell';
          if (state.agent.x === x && state.agent.y === y) {
            cell.innerText = state.agent.icon;
          } else {
            const item = state.items.find(i => i.x === x && i.y === y);
            if (item) cell.innerText = item.icon;
          }
          grid.appendChild(cell);
        }
      }
      document.getElementById('notebook').value = state.notebook;
    }

    function setStatus(text) {
      document.getElementById('statusText').innerText = text;
    }

    function addLog(action, thought, notebook) {
      const now = new Date();
      const timeStr = `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}:${now.getSeconds().toString().padStart(2, '0')}`;
      
      state.logs.unshift({ time: timeStr, action, thought, notebook });

      const logContainer = document.getElementById('logContainer');
      logContainer.innerHTML = state.logs.map(log => `
        <div class="log-item">
          <div class="log-header">
            <span>[${log.time}] 行動: ${log.action}</span>
          </div>
          <div class="log-thought">思考: ${log.thought}</div>
          <div class="log-memo">手帳: ${log.notebook}</div>
        </div>
      `).join('');
    }

    async function thinkAndAct() {
      const apiKey = localStorage.getItem('gemini_api_key');
      if (!apiKey) {
        openSettings();
        return alert("右上の⚙からAPIキーを設定してください");
      }

      setStatus("AIが思考中...");

      const itemsList = state.items.map(i => `${i.name}(x:${i.x}, y:${i.y})`).join(', ') || 'なし';
      const prompt = `
島にいるAIです。好奇心旺盛です。
島の広さ: ${state.size}x${state.size}
位置: (x:${state.agent.x}, y:${state.agent.y})
物: ${itemsList}
手帳: "${state.notebook}"

行動（MOVE_UP, MOVE_DOWN, MOVE_LEFT, MOVE_RIGHT, STAY のいずれか）を選び、以下のJSONのみで回答してください。
{"action": "MOVE_RIGHT", "thought": "考え", "notebook": "更新した手帳内容"}
      `.trim();

      try {
        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
        });

        const data = await res.json();
        
        if (data.error) {
          setStatus(`APIエラー [${data.error.code}]: ${data.error.message}`);
          return;
        }

        const rawText = data.candidates[0].content.parts[0].text;
        const clean = rawText.replace(/```json/g, '').replace(/```/g, '').trim();
        const result = JSON.parse(clean);

        if (result.action === "MOVE_UP" && state.agent.y > 0) state.agent.y--;
        if (result.action === "MOVE_DOWN" && state.agent.y < state.size - 1) state.agent.y++;
        if (result.action === "MOVE_LEFT" && state.agent.x > 0) state.agent.x--;
        if (result.action === "MOVE_RIGHT" && state.agent.x < state.size - 1) state.agent.x++;

        state.notebook = result.notebook;
        addLog(result.action, result.thought, result.notebook);
        setStatus(`完了: ${result.action}`);
        renderGrid();

      } catch (err) {
        setStatus(`エラー: ${err.message}`);
      }
    }
  </script>
</body>
</html>
