<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>3D空間コア＆生命の種 v15</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
  }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: #0d1520;
    font-family: "Hiragino Maru Gothic ProN", "Rounded Mplus 1c", sans-serif;
    color: #fff;
  }

  /* 3D全画面キャンバス（主役：絶対に崩さない） */
  #canvas-container {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    z-index: 1;
  }

  /* 左上のちいさな状態バー（画面を邪魔しない） */
  #mini-status {
    position: fixed;
    top: 12px;
    left: 12px;
    z-index: 10;
    background: rgba(15, 25, 40, 0.72);
    backdrop-filter: blur(6px);
    padding: 8px 12px;
    border-radius: 14px;
    border: 1px solid rgba(255, 255, 255, 0.18);
    font-size: 12px;
    line-height: 1.5;
    pointer-events: none;
  }
  .bar-wrap {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 2px;
  }
  .bar-bg {
    width: 65px;
    height: 7px;
    background: rgba(255,255,255,0.2);
    border-radius: 4px;
    overflow: hidden;
  }
  .bar-fill {
    height: 100%;
    transition: width 0.3s;
  }
  #ai-speech {
    margin-top: 5px;
    font-size: 11px;
    color: #a8e6cf;
    max-width: 190px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* 右上のメニューボタン群 */
  #top-right-btns {
    position: fixed;
    top: 12px;
    right: 12px;
    z-index: 10;
    display: flex;
    gap: 8px;
  }
  .icon-btn {
    background: rgba(20, 35, 55, 0.8);
    backdrop-filter: blur(6px);
    color: #fff;
    border: 1px solid rgba(255, 255, 255, 0.25);
    border-radius: 12px;
    padding: 8px 12px;
    font-size: 13px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 4px 10px rgba(0,0,0,0.3);
  }
  .icon-btn:active {
    transform: scale(0.95);
  }

  /* 下部の最小限のカメラ＆お世話ボタン（コンパクト配置） */
  #bottom-bar {
    position: fixed;
    bottom: 14px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    display: flex;
    gap: 6px;
    background: rgba(15, 25, 40, 0.75);
    backdrop-filter: blur(6px);
    padding: 6px 10px;
    border-radius: 20px;
    border: 1px solid rgba(255, 255, 255, 0.2);
    white-space: nowrap;
  }
  .cam-btn {
    background: rgba(255, 255, 255, 0.12);
    color: #eee;
    border: none;
    border-radius: 14px;
    padding: 6px 11px;
    font-size: 12px;
    font-weight: bold;
    cursor: pointer;
  }
  .cam-btn.active {
    background: #38b6ff;
    color: #001a2c;
  }
  .act-btn {
    background: rgba(255, 190, 80, 0.25);
    color: #ffe0a3;
    border: 1px solid rgba(255, 190, 80, 0.4);
    border-radius: 14px;
    padding: 6px 10px;
    font-size: 12px;
    cursor: pointer;
  }

  /* 小窓（モーダル）：初期状態は必ず display: none; */
  .modal-overlay {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    z-index: 100;
    background: rgba(0, 0, 0, 0.55);
    backdrop-filter: blur(4px);
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  .modal-card {
    background: rgba(22, 34, 50, 0.96);
    border: 1px solid rgba(255, 255, 255, 0.25);
    border-radius: 18px;
    width: 100%;
    max-width: 400px;
    max-height: 82vh;
    overflow-y: auto;
    padding: 18px;
    box-shadow: 0 12px 32px rgba(0,0,0,0.6);
    animation: popIn 0.2s ease-out;
  }
  @keyframes popIn {
    from { opacity: 0; transform: translateY(10px) scale(0.97); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  .modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    padding-bottom: 8px;
    border-bottom: 1px solid rgba(255,255,255,0.15);
  }
  .modal-title {
    font-size: 16px;
    font-weight: bold;
    color: #7ce0ff;
  }
  .close-btn {
    background: rgba(255,255,255,0.15);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 4px 10px;
    font-size: 13px;
    cursor: pointer;
  }
  .field-group {
    margin-bottom: 12px;
  }
  .field-group label {
    display: block;
    font-size: 12px;
    color: #b8d0e8;
    margin-bottom: 4px;
  }
  .field-group input, .field-group select {
    width: 100%;
    padding: 8px 10px;
    border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.25);
    background: rgba(10, 18, 28, 0.9);
    color: #fff;
    font-size: 13px;
  }
  .full-btn {
    width: 100%;
    padding: 10px;
    border-radius: 10px;
    border: none;
    background: #38b6ff;
    color: #001e30;
    font-weight: bold;
    font-size: 13px;
    cursor: pointer;
    margin-top: 6px;
  }
  .log-list {
    font-size: 12px;
    line-height: 1.6;
    color: #dcebf7;
    max-height: 220px;
    overflow-y: auto;
    background: rgba(0,0,0,0.25);
    padding: 10px;
    border-radius: 10px;
  }
  .log-item {
    margin-bottom: 6px;
    padding-bottom: 4px;
    border-bottom: 1px dashed rgba(255,255,255,0.1);
  }
</style>
<!-- Three.js & OrbitControls -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

<!-- 1. 主役の3D全画面水槽キャンバス -->
<div id="canvas-container"></div>

<!-- 2. 左上の最小限ステータス表示 -->
<div id="mini-status">
  <div>🌱 <b>生命の種</b> <span id="body-label">（ふつう体型）</span></div>
  <div class="bar-wrap">⚡元気 <div class="bar-bg"><div id="bar-energy" class="bar-fill" style="width:85%; background:#4cd964;"></div></div></div>
  <div class="bar-wrap">💪体力 <div class="bar-bg"><div id="bar-stamina" class="bar-fill" style="width:90%; background:#5ac8fa;"></div></div></div>
  <div class="bar-wrap">💖気持 <div class="bar-bg"><div id="bar-mental" class="bar-fill" style="width:80%; background:#ff9500;"></div></div></div>
  <div id="ai-speech">💭 地上1階をおさんぽ中…</div>
</div>

<!-- 3. 右上の小窓ボタン（手帳・設定） -->
<div id="top-right-btns">
  <button class="icon-btn" onclick="openModal('notebook-modal')">📖 手帳</button>
  <button class="icon-btn" onclick="openModal('settings-modal')">⚙️ 設定</button>
</div>

<!-- 4. 下部のカメラ3分類＆ちょっとしたお世話バー -->
<div id="bottom-bar">
  <button id="cam-out" class="cam-btn active" onclick="setCameraMode('out')">🔭 そと</button>
  <button id="cam-follow" class="cam-btn" onclick="setCameraMode('follow')">🐾 ついていく</button>
  <button id="cam-in" class="cam-btn" onclick="setCameraMode('in')">👀 なか</button>
  <button class="act-btn" onclick="dropApple()">🍎 リンゴ</button>
  <button class="act-btn" onclick="cycleBodySize()">📏 体型</button>
</div>

<!-- 5. 手帳の小窓（初期状態は display: none;） -->
<div id="notebook-modal" class="modal-overlay" onclick="backdropClose(event, 'notebook-modal')">
  <div class="modal-card">
    <div class="modal-header">
      <div class="modal-title">📖 観察手帳（AIと生き物の記録）</div>
      <button class="close-btn" onclick="closeModal('notebook-modal')">とじる</button>
    </div>
    <div class="field-group">
      <label>現在の居場所と様子</label>
      <div id="detail-location" style="font-size:13px; color:#fff; padding:6px 0;">地上1階（無傷ブロックの上）</div>
    </div>
    <div class="field-group">
      <label>AIへのひとこと声かけ（送信するとAIがすぐ判断します）</label>
      <div style="display:flex; gap:6px;">
        <input type="text" id="user-talk-input" placeholder="例：地下へ斜めに穴を掘ってみて！">
        <button class="close-btn" style="background:#38b6ff; color:#001e30; font-weight:bold; white-space:nowrap;" onclick="triggerAiDecision(true)">送信</button>
      </div>
    </div>
    <div class="field-group">
      <label>これまでの行動きろく</label>
      <div id="log-container" class="log-list"></div>
    </div>
  </div>
</div>

<!-- 6. 設定の小窓（初期状態は display: none;） -->
<div id="settings-modal" class="modal-overlay" onclick="backdropClose(event, 'settings-modal')">
  <div class="modal-card">
    <div class="modal-header">
      <div class="modal-title">⚙️ 設定（AI通信・画面の軽さ）</div>
      <button class="close-btn" onclick="closeModal('settings-modal')">とじる</button>
    </div>
    <div class="field-group">
      <label>Gemini APIキー（入れるとAIが本気で考えて動きます）</label>
      <input type="password" id="api-key-input" placeholder="AIzaSy...">
    </div>
    <div class="field-group">
      <label>AIモデル（gemini-3.8-flash以上のみ使用）</label>
      <select id="ai-model-select">
        <option value="gemini-3.8-flash" selected>gemini-3.8-flash（推奨・高速）</option>
        <option value="gemini-3.8-pro">gemini-3.8-pro（高精度）</option>
      </select>
    </div>
    <div class="field-group">
      <label>スマホの発熱をおさえる設定（3段階）</label>
      <select id="perf-select" onchange="applyPerformanceMode()">
        <option value="eco">省エネ（電池長持ち・熱くならない）</option>
        <option value="normal" selected>ふつう（バランス）</option>
        <option value="high">きれい（高画質）</option>
      </select>
    </div>
    <div class="field-group">
      <label>地下の手前ブロックの透け方</label>
      <select id="xray-select" onchange="rebuildWorldMeshes()">
        <option value="auto" selected>みやすい半透明（断面くっきり）</option>
        <option value="solid">しっかり不透明（土のかたまり）</option>
      </select>
    </div>
    <button class="full-btn" onclick="saveSettings()">設定を保存してAIとつなぐ</button>
    <button class="full-btn" style="background:rgba(255,100,100,0.25); color:#ffb3b3; margin-top:10px;" onclick="resetWorld()">水槽の土をさいしょからに戻す</button>
  </div>
</div>

<script>
/* ============================================================================
   1. 小窓（モーダル）の開閉処理（初期状態は display: none; 厳守）
============================================================================ */
function openModal(id) {
  document.getElementById(id).style.display = 'flex';
}
function closeModal(id) {
  document.getElementById(id).style.display = 'none';
}
function backdropClose(e, id) {
  if (e.target.id === id) closeModal(id);
}

function addLog(text) {
  const box = document.getElementById('log-container');
  const item = document.createElement('div');
  item.className = 'log-item';
  const now = new Date();
  const timeStr = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}`;
  item.textContent = `[${timeStr}] ${text}`;
  box.prepend(item);
  while (box.children.length > 30) box.removeChild(box.lastChild);
}

/* ============================================================================
   2. 空間コア仕様：地上5層・地下5層（計10層）＆ 無傷1マス塊＋掘削サブブロック
   - グリッド広さ：X=8マス, Z=8マス
   - 高さY：0〜4 が「地下5層（B5〜B1）」、5〜9 が「地上5層（1F〜5F）」の計10層
   - 無傷の土マス（damage === 0）は 1×1×1 の単一Boxとして隙間・透けゼロで描画
   - 少しでも掘られた土マス（damage > 0）は 2×2×2 のサブブロックでアリの巣の斜め穴を表現
============================================================================ */
const GRID_W = 8;
const GRID_D = 8;
const TOTAL_LAYERS = 10; // 0..4: 地下5層, 5..9: 地上5層
const UNDERGROUND_LAYERS = 5; // Y=0,1,2,3,4 が土で埋まっている初期状態

// ワールド配列：world[y][z][x]
// { type: 'air'|'soil', intact: true|false, sub: [8個のbool(2x2x2)], tunnelLow: false }
let world = [];

function initWorldData() {
  world = [];
  for (let y = 0; y < TOTAL_LAYERS; y++) {
    const layer = [];
    for (let z = 0; z < GRID_D; z++) {
      const row = [];
      for (let x = 0; x < GRID_W; x++) {
        if (y < UNDERGROUND_LAYERS) {
          row.push({
            type: 'soil',
            intact: true, // 無傷なら1マス塊で描画
            sub: [true, true, true, true, true, true, true, true], // 2x2x2サブブロック
            lowCeiling: false // 上半分だけ残った「ほふく前進トンネル」かどうか
          });
        } else {
          row.push({
            type: 'air',
            intact: false,
            sub: [false, false, false, false, false, false, false, false],
            lowCeiling: false
          });
        }
      }
      layer.push(row);
    }
    world.push(layer);
  }
}

/* ============================================================================
   3. Three.js 3D水槽とカメラ3分類（「そと」「ついていく」「なか」）
============================================================================ */
let scene, camera, renderer, controls;
let worldGroup, appleGroup;
let creatureGroup, creatureBodyMesh, leftEyeMesh, rightEyeMesh;
let targetFrameInterval = 1000 / 30; // デフォルト30fps（ふつう）
let lastRenderTime = 0;

// カメラモード：'out'（そと）, 'follow'（ついていく）, 'in'（なか・見上げ360度）
let cameraMode = 'out';
let inCamYaw = 0;
let inCamPitch = 0.15;
let isDraggingInCam = false;
let prevPointer = { x: 0, y: 0 };

// 地下5層の色（深さごとにきれいな地層カラー）
const SOIL_COLORS = [
  0x3b2d26, // Y=0: 地下5階（いちばん深い岩盤土）
  0x4e3829, // Y=1: 地下4階（深い粘土）
  0x634630, // Y=2: 地下3階（しめった土）
  0x7a5638, // Y=3: 地下2階（やわらかい土）
  0x598c3e  // Y=4: 地下1階（地表の草と黒土）
];

function gridToWorld(gx, gy, gz) {
  // 中心を (0, 0, 0) 付近に配置。Y=5（地表の上）が worldY = 0.5 になるよう調整
  return new THREE.Vector3(
    gx - GRID_W / 2 + 0.5,
    gy - UNDERGROUND_LAYERS + 0.5,
    gz - GRID_D / 2 + 0.5
  );
}

function initThree() {
  const container = document.getElementById('canvas-container');
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0d1826);

  camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
  camera.position.set(10, 7, 12);

  renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
  container.appendChild(renderer.domElement);

  controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.target.set(0, 0, 0);
  controls.maxDistance = 26;
  controls.minDistance = 1.5;

  // ライト
  const ambient = new THREE.AmbientLight(0xffffff, 0.72);
  scene.add(ambient);

  const dirLight = new THREE.DirectionalLight(0xfff6e5, 0.85);
  dirLight.position.set(8, 15, 10);
  scene.add(dirLight);

  // 水槽の10層ガラスフレーム（地上5層・地下5層の境界がひと目でわかる枠）
  buildTankFrame();

  worldGroup = new THREE.Group();
  scene.add(worldGroup);

  appleGroup = new THREE.Group();
  scene.add(appleGroup);

  buildCreatureMesh();
  rebuildWorldMeshes();

  // 「なか（内側目線）」のときにドラッグで引っかかりなく360度見渡せるイベント
  const dom = renderer.domElement;
  dom.addEventListener('pointerdown', (e) => {
    if (cameraMode === 'in') {
      isDraggingInCam = true;
      prevPointer.x = e.clientX;
      prevPointer.y = e.clientY;
    }
  });
  window.addEventListener('pointermove', (e) => {
    if (cameraMode === 'in' && isDraggingInCam) {
      const dx = e.clientX - prevPointer.x;
      const dy = e.clientY - prevPointer.y;
      prevPointer.x = e.clientX;
      prevPointer.y = e.clientY;
      inCamYaw -= dx * 0.007;
      inCamPitch = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, inCamPitch + dy * 0.007));
    }
  });
  window.addEventListener('pointerup', () => {
    isDraggingInCam = false;
  });

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
}

function buildTankFrame() {
  const frameGroup = new THREE.Group();

  // 全体10層の外枠（幅8 × 高さ10 × 奥行き8）
  const tankGeo = new THREE.BoxGeometry(GRID_W, TOTAL_LAYERS, GRID_D);
  const tankEdges = new THREE.EdgesGeometry(tankGeo);
  const tankLine = new THREE.LineSegments(
    tankEdges,
    new THREE.LineBasicMaterial({ color: 0x5ce1e6, transparent: true, opacity: 0.45 })
  );
  frameGroup.add(tankLine);

  // 地上5層と地下5層の境目（Y=0ライン）の明るい枠線
  const surfaceGeo = new THREE.EdgesGeometry(new THREE.PlaneGeometry(GRID_W, GRID_D));
  const surfaceLine = new THREE.LineSegments(
    surfaceGeo,
    new THREE.LineBasicMaterial({ color: 0xa8ff78, transparent: true, opacity: 0.65 })
  );
  surfaceLine.rotation.x = Math.PI / 2;
  surfaceLine.position.y = 0;
  frameGroup.add(surfaceLine);

  // 地上5層のうっすら空中階層ガイド（1F〜5Fのコーナー目印）
  for (let ly = -4; ly <= 4; ly++) {
    if (ly === 0) continue;
    const gGeo = new THREE.EdgesGeometry(new THREE.PlaneGeometry(GRID_W, GRID_D));
    const gLine = new THREE.LineSegments(
      gGeo,
      new THREE.LineBasicMaterial({
        color: ly > 0 ? 0x38b6ff : 0xc89d66,
        transparent: true,
        opacity: 0.12
      })
    );
    gLine.rotation.x = Math.PI / 2;
    gLine.position.y = ly;
    frameGroup.add(gLine);
  }

  scene.add(frameGroup);
}

/* ============================================================================
   4. 無傷ブロックの「1マス塊」描画 ＆ 掘削マスのサブブロック（アリの巣）描画
   - 無傷ブロック（intact === true）は 1.0 × 1.0 × 1.0 の完全な1マス塊で描画し、
     アイテム下の透けや断面の隙間・ギザギザをゼロにする。
   - 掘られたブロック（intact === false）は 0.5サイズのサブブロックで斜め穴や低い天井を表現。
============================================================================ */
const unitBoxGeo = new THREE.BoxGeometry(1.0, 1.0, 1.0);
const unitEdgeGeo = new THREE.EdgesGeometry(unitBoxGeo);
const subBoxGeo = new THREE.BoxGeometry(0.5, 0.5, 0.5);

function rebuildWorldMeshes() {
  while (worldGroup.children.length > 0) {
    const c = worldGroup.children[0];
    worldGroup.remove(c);
  }

  const xrayMode = document.getElementById('xray-select') ? document.getElementById('xray-select').value : 'auto';

  for (let y = 0; y < UNDERGROUND_LAYERS; y++) {
    const layerColor = SOIL_COLORS[y];

    for (let z = 0; z < GRID_D; z++) {
      for (let x = 0; x < GRID_W; x++) {
        const cell = world[y][z][x];
        if (cell.type !== 'soil') continue;

        const wPos = gridToWorld(x, y, z);

        if (cell.intact) {
          // 【重要】無傷の土ブロックは「1マスの塊」としてピシッと描画（隙間・ギザギザなし）
          // 外周のブロックで、かつ地下にトンネルがある時だけ、中が見やすいように少しだけ透けさせる設定に対応
          const isOuterWall = (x === 0 || x === GRID_W - 1 || z === 0 || z === GRID_D - 1);
          const useTrans = (xrayMode === 'auto' && isOuterWall && y < UNDERGROUND_LAYERS - 1);

          const mat = new THREE.MeshLambertMaterial({
            color: layerColor,
            transparent: useTrans,
            opacity: useTrans ? 0.78 : 1.0
          });
          const mesh = new THREE.Mesh(unitBoxGeo, mat);
          mesh.position.copy(wPos);
          worldGroup.add(mesh);

          // 1マス塊の輪郭をうっすら入れて綺麗な地層ブロックに見せる
          const edgeMat = new THREE.LineBasicMaterial({
            color: 0x1a120b,
            transparent: true,
            opacity: 0.22
          });
          const edge = new THREE.LineSegments(unitEdgeGeo, edgeMat);
          edge.position.copy(wPos);
          worldGroup.add(edge);

        } else {
          // 掘削されたマス：2×2×2のサブブロックで「斜め掘り」や「ほふく前進用の低い天井」を表現
          const subMat = new THREE.MeshLambertMaterial({ color: layerColor });
          let idx = 0;
          for (let sy = 0; sy < 2; sy++) {
            for (let sz = 0; sz < 2; sz++) {
              for (let sx = 0; sx < 2; sx++) {
                if (cell.sub[idx]) {
                  const subMesh = new THREE.Mesh(subBoxGeo, subMat);
                  subMesh.position.set(
                    wPos.x + (sx === 0 ? -0.25 : 0.25),
                    wPos.y + (sy === 0 ? -0.25 : 0.25),
                    wPos.z + (sz === 0 ? -0.25 : 0.25)
                  );
                  worldGroup.add(subMesh);
                }
                idx++;
              }
            }
          }
        }
      }
    }
  }
}

/* ============================================================================
   5. 生命の種（LifeCore）＆ 生き物の斜め掘り・ほふく前進・体格変化
============================================================================ */
const lifeCore = {
  gx: 4,
  gy: 5, // Y=5 が地上1階（Y=4の無傷ブロックの真上）
  gz: 4,
  energy: 85,
  stamina: 90,
  mental: 80,
  bodySizeIndex: 1, // 0: 小柄(0.65), 1: ふつう(1.0), 2: 大きめ(1.35)
  isCrawling: false, // ほふく前進中かどうか
  currentAction: 'おさんぽ',
  speech: '地上1階をおさんぽ中…',
  targetPos: new THREE.Vector3(0.5, 0.5, 0.5)
};

const BODY_SCALES = [0.65, 1.0, 1.35];
const BODY_NAMES = ['小柄体型', 'ふつう体型', '大きめ体型'];

let apples = [];

function buildCreatureMesh() {
  creatureGroup = new THREE.Group();

  const bodyGeo = new THREE.SphereGeometry(0.36, 20, 20);
  const bodyMat = new THREE.MeshLambertMaterial({ color: 0xff7eb3 });
  creatureBodyMesh = new THREE.Mesh(bodyGeo, bodyMat);
  creatureGroup.add(creatureBodyMesh);

  // かわいい目
  const eyeGeo = new THREE.SphereGeometry(0.065, 10, 10);
  const eyeMat = new THREE.MeshBasicMaterial({ color: 0x111111 });
  leftEyeMesh = new THREE.Mesh(eyeGeo, eyeMat);
  rightEyeMesh = new THREE.Mesh(eyeGeo, eyeMat);
  leftEyeMesh.position.set(-0.12, 0.08, 0.31);
  rightEyeMesh.position.set(0.12, 0.08, 0.31);
  creatureGroup.add(leftEyeMesh);
  creatureGroup.add(rightEyeMesh);

  const startW = gridToWorld(lifeCore.gx, lifeCore.gy, lifeCore.gz);
  creatureGroup.position.copy(startW);
  lifeCore.targetPos.copy(startW);

  scene.add(creatureGroup);
}

// 体型（体格）の切り替え：体格によって掘れる穴の大きさやほふく前進が変わる
function cycleBodySize() {
  lifeCore.bodySizeIndex = (lifeCore.bodySizeIndex + 1) % 3;
  document.getElementById('body-label').textContent = `（${BODY_NAMES[lifeCore.bodySizeIndex]}）`;
  addLog(`体格が「${BODY_NAMES[lifeCore.bodySizeIndex]}」に変化しました。`);
}

// リンゴを地上（または一番上の地面）に落とす（無傷ブロックの上なので絶対に透けない）
function dropApple() {
  const rx = Math.floor(Math.random() * (GRID_W - 2)) + 1;
  const rz = Math.floor(Math.random() * (GRID_D - 2)) + 1;
  // 一番高い土の上を探す
  let surfaceY = UNDERGROUND_LAYERS;
  for (let y = TOTAL_LAYERS - 1; y >= 0; y--) {
    if (world[y][rz][rx].type === 'soil' && world[y][rz][rx].intact) {
      surfaceY = y + 1;
      break;
    }
  }
  surfaceY = Math.min(TOTAL_LAYERS - 1, surfaceY);

  const appleMesh = new THREE.Mesh(
    new THREE.SphereGeometry(0.24, 14, 14),
    new THREE.MeshLambertMaterial({ color: 0xff3b30 })
  );
  const wPos = gridToWorld(rx, surfaceY, rz);
  wPos.y -= 0.24; // 1マス塊の地面の上にピタッと乗せる
  appleMesh.position.copy(wPos);
  appleGroup.add(appleMesh);

  apples.push({ gx: rx, gy: surfaceY, gz: rz, mesh: appleMesh });
  addLog(`地上（X:${rx}, Z:${rz}）に🍎リンゴを置きました！`);
}

// アリの巣のような「斜め掘り」＆「ほふく前進トンネル」掘削処理
function excavateCell(gx, gy, gz, makeCrawlTunnel) {
  if (gy < 0 || gy >= UNDERGROUND_LAYERS) return;
  const cell = world[gy][gz][gx];
  if (!cell) return;

  cell.intact = false;

  if (makeCrawlTunnel && lifeCore.bodySizeIndex <= 1) {
    // 小柄・ふつう体型のときは、上半分（sy=1）の土を残して「ほふく前進でくぐる低いトンネル」を掘る
    cell.sub = [
      false, false, false, false, // 下半分（sy=0）を空洞にする
      true,  true,  true,  true   // 上半分（sy=1）は天井として残す
    ];
    cell.lowCeiling = true;
    cell.type = 'soil';
  } else {
    // 大きめ体型や斜め階段掘りのときは、通り道をしっかり空ける（隅のサブブロックだけ少し残してアリの巣感を出す）
    if (lifeCore.bodySizeIndex === 2) {
      cell.type = 'air';
      cell.sub = [false, false, false, false, false, false, false, false];
      cell.lowCeiling = false;
    } else {
      cell.type = 'soil';
      cell.sub = [false, false, false, false, true, false, false, true];
      cell.lowCeiling = false;
    }
  }
  rebuildWorldMeshes();
}

// 1ステップの行動実行（AIの判断または自律コアから呼ばれる）
function executeCreatureMove(actionType, speechText) {
  lifeCore.speech = speechText || lifeCore.speech;

  // リンゴが近くにあれば優先して向かう
  if (actionType === 'eat' && apples.length > 0) {
    const targetApple = apples[0];
    lifeCore.gx = targetApple.gx;
    lifeCore.gy = targetApple.gy;
    lifeCore.gz = targetApple.gz;
    lifeCore.isCrawling = false;

    appleGroup.remove(targetApple.mesh);
    apples.shift();

    lifeCore.energy = Math.min(100, lifeCore.energy + 25);
    lifeCore.mental = Math.min(100, lifeCore.mental + 15);
    addLog(`🍎 リンゴを食べて元気いっぱい！（${lifeCore.speech}）`);
    updateTargetWorldPosition();
    updateStatusUI();
    return;
  }

  const dirs = [
    { dx: 1, dz: 0 },
    { dx: -1, dz: 0 },
    { dx: 0, dz: 1 },
    { dx: 0, dz: -1 }
  ];
  const d = dirs[Math.floor(Math.random() * dirs.length)];
  const nx = Math.max(1, Math.min(GRID_W - 2, lifeCore.gx + d.dx));
  const nz = Math.max(1, Math.min(GRID_D - 2, lifeCore.gz + d.dz));

  if (actionType === 'dig_diagonal') {
    // アリの巣のように「斜め下」へ掘り進む（地下5層 Y=0 まで掘れる）
    const ny = Math.max(0, lifeCore.gy - 1);
    // 斜め移動するとき、頭上の引っかかりも少し削って滑らかな斜めトンネルにする
    if (lifeCore.gy < UNDERGROUND_LAYERS) {
      excavateCell(nx, lifeCore.gy, nz, false);
    }
    excavateCell(nx, ny, nz, false);

    lifeCore.gx = nx;
    lifeCore.gy = ny;
    lifeCore.gz = nz;
    lifeCore.isCrawling = false;
    lifeCore.stamina = Math.max(10, lifeCore.stamina - 6);
    addLog(`⛏️ 地下${UNDERGROUND_LAYERS - ny}階へ斜め掘り！（${lifeCore.speech}）`);

  } else if (actionType === 'crawl_tunnel') {
    // 同じ地下の階層で、天井が低い穴を「ほふく前進」で掘り進む
    const ny = Math.min(UNDERGROUND_LAYERS - 1, Math.max(0, lifeCore.gy));
    excavateCell(nx, ny, nz, true);

    lifeCore.gx = nx;
    lifeCore.gy = ny;
    lifeCore.gz = nz;
    lifeCore.isCrawling = true;
    lifeCore.stamina = Math.max(10, lifeCore.stamina - 4);
    addLog(`🐾 せまい地下トンネルをほふく前進！（${lifeCore.speech}）`);

  } else if (actionType === 'climb_up') {
    // 斜め上へ登って地上5層側へ戻る
    const ny = Math.min(5, lifeCore.gy + 1);
    if (ny < UNDERGROUND_LAYERS) {
      excavateCell(nx, ny, nz, false);
    }
    lifeCore.gx = nx;
    lifeCore.gy = ny;
    lifeCore.gz = nz;
    lifeCore.isCrawling = false;
    addLog(`☀️ 上の階へ移動しました（${lifeCore.speech}）`);

  } else if (actionType === 'sleep') {
    lifeCore.stamina = Math.min(100, lifeCore.stamina + 25);
    lifeCore.energy = Math.min(100, lifeCore.energy + 10);
    lifeCore.isCrawling = false;
    addLog(`💤 すやすや休憩して体力を回復（${lifeCore.speech}）`);

  } else {
    // ふつうのおさんぽ移動
    lifeCore.gx = nx;
    lifeCore.gz = nz;
    if (lifeCore.gy < UNDERGROUND_LAYERS) {
      const cell = world[lifeCore.gy][nz][nx];
      if (cell.intact) {
        excavateCell(nx, lifeCore.gy, nz, true);
      }
      lifeCore.isCrawling = cell.lowCeiling;
    } else {
      lifeCore.isCrawling = false;
    }
  }

  updateTargetWorldPosition();
  updateStatusUI();
}

function updateTargetWorldPosition() {
  const wPos = gridToWorld(lifeCore.gx, lifeCore.gy, lifeCore.gz);
  // ほふく前進中は重心を低くする
  wPos.y += lifeCore.isCrawling ? -0.26 : -0.14;
  lifeCore.targetPos.copy(wPos);
}

function updateStatusUI() {
  document.getElementById('bar-energy').style.width = `${lifeCore.energy}%`;
  document.getElementById('bar-stamina').style.width = `${lifeCore.stamina}%`;
  document.getElementById('bar-mental').style.width = `${lifeCore.mental}%`;
  document.getElementById('ai-speech').textContent = `💭 ${lifeCore.speech}`;

  const floorText = lifeCore.gy >= UNDERGROUND_LAYERS
    ? `地上${lifeCore.gy - UNDERGROUND_LAYERS + 1}階`
    : `地下${UNDERGROUND_LAYERS - lifeCore.gy}階`;
  const crawlText = lifeCore.isCrawling ? '（ほふく前進中）' : '';
  document.getElementById('detail-location').textContent = `${floorText} [X:${lifeCore.gx}, Z:${lifeCore.gz}] ${crawlText}`;
}

/* ============================================================================
   6. カメラコア3分類（「そと」「ついていく」「なか」）の切り替えと更新
   - out: 外から水槽全体を見渡す
   - follow: 生き物の後ろから追いかける
   - in: 生き物の目線（水槽やトンネルの内側）から見上げ・360度見渡し
============================================================================ */
function setCameraMode(mode) {
  cameraMode = mode;
  document.getElementById('cam-out').classList.toggle('active', mode === 'out');
  document.getElementById('cam-follow').classList.toggle('active', mode === 'follow');
  document.getElementById('cam-in').classList.toggle('active', mode === 'in');

  if (mode === 'out') {
    controls.enabled = true;
    creatureGroup.visible = true;
    camera.position.set(10, 7, 12);
    controls.target.set(0, 0, 0);
  } else if (mode === 'follow') {
    controls.enabled = true;
    creatureGroup.visible = true;
  } else if (mode === 'in') {
    // 内側目線ではOrbitControlsの引っかかりをなくし、どの方向も360度見上げられるようにする
    controls.enabled = false;
    creatureGroup.visible = false; // 自分の体が視界を塞がないようにする
  }
}

function updateCameraByMode() {
  const cPos = creatureGroup.position;

  if (cameraMode === 'out') {
    controls.update();

  } else if (cameraMode === 'follow') {
    // 生き物をなめらかに追いかける
    const desiredCamPos = new THREE.Vector3(cPos.x + 2.8, cPos.y + 2.0, cPos.z + 3.2);
    camera.position.lerp(desiredCamPos, 0.08);
    controls.target.lerp(cPos, 0.12);
    controls.update();

  } else if (cameraMode === 'in') {
    // 水槽や地下トンネルの「なか」から、引っかかりなく360度＆上を見上げるカメラ
    camera.position.set(cPos.x, cPos.y + 0.12, cPos.z);
    const lookDir = new THREE.Vector3(
      Math.sin(inCamYaw) * Math.cos(inCamPitch),
      Math.sin(inCamPitch),
      Math.cos(inCamYaw) * Math.cos(inCamPitch)
    );
    camera.lookAt(
      camera.position.x + lookDir.x,
      camera.position.y + lookDir.y,
      camera.position.z + lookDir.z
    );
  }
}

/* ============================================================================
   7. 最優先AI通信（gemini-3.8-flash以上厳守・張りぼて禁止）
   - APIキーが設定されていれば、必ずAI（gemini-3.8-flash以上）が現在の階層・体力・
     リンゴの有無を見て次の行動（斜め掘り・ほふく前進・食事・登る・休憩）を決定し反映する。
============================================================================ */
let isRequestingAi = false;

async function triggerAiDecision(fromUserMessage = false) {
  if (isRequestingAi) return;

  const apiKey = localStorage.getItem('LIFE_CORE_API_KEY') || document.getElementById('api-key-input').value.trim();
  const modelName = localStorage.getItem('LIFE_CORE_MODEL') || document.getElementById('ai-model-select').value;
  const userTalk = document.getElementById('user-talk-input').value.trim();

  // APIキーが未入力のときは、自律コア（LifeCore）で動かす
  if (!apiKey) {
    runAutonomousDecision();
    return;
  }

  isRequestingAi = true;
  const floorDesc = lifeCore.gy >= UNDERGROUND_LAYERS
    ? `地上${lifeCore.gy - UNDERGROUND_LAYERS + 1}階`
    : `地下${UNDERGROUND_LAYERS - lifeCore.gy}階`;

  const prompt = `あなたは3D水槽（地上5層・地下5層の計10層）で暮らす小さな生き物の頭脳です。
現在の状態：
- 居場所: ${floorDesc} (Y=${lifeCore.gy})
- 元気: ${lifeCore.energy}, 体力: ${lifeCore.stamina}, 気持ち: ${lifeCore.mental}
- 体型: ${BODY_NAMES[lifeCore.bodySizeIndex]}
- 水槽内のリンゴの数: ${apples.length}個
- ユーザーからの声かけ: "${fromUserMessage && userTalk ? userTalk : '特になし'}"

次の行動を以下の5つから1つだけ選び、JSON形式のみで返答してください：
- "eat": リンゴを食べに行く
- "dig_diagonal": 地下へアリの巣のように斜め掘りする
- "crawl_tunnel": 狭い穴をほふく前進で掘り進む
- "climb_up": 上の階へ登る
- "sleep": 休んで体力を回復する
- "walk": 今の階をおさんぽする

出力形式（JSONのみ）:
{"action": "dig_diagonal", "speech": "15文字以内の可愛いひとりごと"}`;

  try {
    const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${encodeURIComponent(apiKey)}`;
    const res = await fetch(endpoint, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        contents: [{ parts: [{ text: prompt }] }],
        generationConfig: { responseMimeType: "application/json", temperature: 0.7 }
      })
    });

    if (!res.ok) {
      throw new Error(`HTTP ${res.status}`);
    }

    const data = await res.json();
    const rawText = data?.candidates?.[0]?.content?.parts?.[0]?.text || '{}';
    const parsed = JSON.parse(rawText);

    if (fromUserMessage) {
      document.getElementById('user-talk-input').value = '';
    }

    executeCreatureMove(parsed.action || 'walk', `🤖AI: ${parsed.speech || 'うごくよ！'}`);
  } catch (err) {
    addLog(`⚠️ AI通信(${modelName})待機中・自律判断へ切替: ${err.message}`);
    runAutonomousDecision();
  } finally {
    isRequestingAi = false;
  }
}

function runAutonomousDecision() {
  if (apples.length > 0 && lifeCore.energy < 95) {
    executeCreatureMove('eat', 'リンゴみつけた！もぐもぐ');
  } else if (lifeCore.stamina < 30) {
    executeCreatureMove('sleep', 'ちょっとおやすみ…💤');
  } else {
    const r = Math.random();
    if (r < 0.35 && lifeCore.gy > 0) {
      executeCreatureMove('dig_diagonal', 'アリの巣みたいに斜め掘り！');
    } else if (r < 0.65 && lifeCore.gy < UNDERGROUND_LAYERS) {
      executeCreatureMove('crawl_tunnel', 'せまい穴をほふく前進！');
    } else if (r < 0.82 && lifeCore.gy < 5) {
      executeCreatureMove('climb_up', '地上へあがろうっと！');
    } else {
      executeCreatureMove('walk', 'キョロキョロ探検中♪');
    }
  }
}

/* ============================================================================
   8. 設定の保存・スマホ発熱防止3段階・リセット処理
============================================================================ */
function saveSettings() {
  const key = document.getElementById('api-key-input').value.trim();
  const model = document.getElementById('ai-model-select').value;
  localStorage.setItem('LIFE_CORE_API_KEY', key);
  localStorage.setItem('LIFE_CORE_MODEL', model);
  applyPerformanceMode();
  closeModal('settings-modal');
  addLog(`⚙️ 設定を保存しました（使用モデル: ${model}）`);
  triggerAiDecision(false);
}

function applyPerformanceMode() {
  const mode = document.getElementById('perf-select').value;
  if (mode === 'eco') {
    targetFrameInterval = 1000 / 18;
    renderer.setPixelRatio(1.0);
  } else if (mode === 'normal') {
    targetFrameInterval = 1000 / 30;
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
  } else {
    targetFrameInterval = 1000 / 60;
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2.0));
  }
}

function resetWorld() {
  initWorldData();
  rebuildWorldMeshes();
  lifeCore.gx = 4;
  lifeCore.gy = 5;
  lifeCore.gz = 4;
  lifeCore.isCrawling = false;
  updateTargetWorldPosition();
  updateStatusUI();
  closeModal('settings-modal');
  addLog('🌱 水槽の土をすべて無傷の1マス塊に戻しました。');
}

/* ============================================================================
   9. メインアニメーションループ（ほふく前進の姿勢変化＆なめらか移動）
============================================================================ */
function animate(now) {
  requestAnimationFrame(animate);
  if (now - lastRenderTime < targetFrameInterval) return;
  lastRenderTime = now;

  // 生き物の位置をなめらかに移動
  const prevPos = creatureGroup.position.clone();
  creatureGroup.position.lerp(lifeCore.targetPos, 0.08);

  // 進行方向を向く
  const moveDelta = creatureGroup.position.clone().sub(prevPos);
  if (moveDelta.lengthSq() > 0.0001) {
    const angle = Math.atan2(moveDelta.x, moveDelta.z);
    creatureGroup.rotation.y = angle;
  }

  // 体格スケールと「ほふく前進」のペタンコ姿勢アニメーション
  const baseScale = BODY_SCALES[lifeCore.bodySizeIndex];
  const breathe = 1 + Math.sin(now * 0.006) * 0.04;
  if (lifeCore.isCrawling) {
    // ほふく前進：縦をギュッと低く（0.52倍）、前後左右に少し伸ばして狭い穴をくぐる
    creatureGroup.scale.set(
      baseScale * 1.15,
      baseScale * 0.52 * breathe,
      baseScale * 1.25
    );
  } else {
    creatureGroup.scale.set(
      baseScale * breathe,
      baseScale * breathe,
      baseScale * breathe
    );
  }

  updateCameraByMode();
  renderer.render(scene, camera);
}

// 初期化実行
window.addEventListener('DOMContentLoaded', () => {
  const savedKey = localStorage.getItem('LIFE_CORE_API_KEY') || '';
  const savedModel = localStorage.getItem('LIFE_CORE_MODEL') || 'gemini-3.8-flash';
  document.getElementById('api-key-input').value = savedKey;
  document.getElementById('ai-model-select').value = savedModel;

  initWorldData();
  initThree();
  updateStatusUI();
  addLog('🌱 地上5層・地下5層（計10層）の3D水槽がスタートしました！');

  // 4.5秒ごとにAI（または自律コア）が判断して行動
  setInterval(() => {
    triggerAiDecision(false);
  }, 4500);

  requestAnimationFrame(animate);
});
</script>
