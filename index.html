<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI自律思考エンジン</title>
  <style>
    body { background: #0f141c; color: #e2e8f0; font-family: sans-serif; margin: 0; padding: 12px; }
    .status-bar { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; background: #1a222d; padding: 10px; border-radius: 8px; font-size: 12px; text-align: center; }
    .bar-bg { background: #2d3748; height: 6px; border-radius: 3px; margin-top: 4px; overflow: hidden; }
    .bar-fill { background: #48bb78; height: 100%; transition: width 0.4s; }
    
    .monitor { background: #141e2b; border: 1px solid #2b6cb0; border-radius: 8px; padding: 12px; margin-top: 12px; min-height: 180px; }
    .monitor-header { display: flex; justify-content: space-between; font-size: 13px; color: #63b3ed; margin-bottom: 8px; font-weight: bold; }
    .thought-box { font-size: 14px; line-height: 1.5; color: #f7fafc; margin-bottom: 10px; }
    .action-badge { display: inline-block; background: #2b6cb0; color: #fff; padding: 4px 8px; border-radius: 4px; font-size: 12px; margin-bottom: 6px; }
    .memory-log { font-size: 12px; color: #a0aec0; border-top: 1px solid #2d3748; padding-top: 8px; margin-top: 8px; max-height: 120px; overflow-y: auto; }

    .stage { background: #1a261e; border-radius: 8px; padding: 16px; margin-top: 12px; text-align: center; position: relative; }
    .robo { font-size: 40px; margin: 10px 0; }
    .field-items { font-size: 13px; color: #cbd5e0; margin-top: 8px; }

    .controls { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 12px; }
    button { background: #2d3748; color: #fff; border: 1px solid #4a5568; border-radius: 8px; padding: 10px 4px; font-size: 12px; cursor: pointer; }
    button:active { background: #4a5568; }
    .think-btn { grid-column: span 4; background: #3182ce; border-color: #63b3ed; font-weight: bold; padding: 12px; font-size: 14px; }
    .api-input { width: 100%; box-sizing: border-box; margin-top: 12px; padding: 8px; background: #1a222d; border: 1px solid #4a5568; color: #fff; border-radius: 4px; }
  </style>
</head>
<body>

  <!-- ステータスバー -->
  <div class="status-bar">
    <div>❤️体力 <span id="val-hp">80</span><div class="bar-bg"><div id="bar-hp" class="bar-fill" style="width:80%; background:#f56565;"></div></div></div>
    <div>💦疲労 <span id="val-fatigue">20</span><div class="bar-bg"><div id="bar-fatigue" class="bar-fill" style="width:20%; background:#ed8936;"></div></div></div>
    <div>🍖空腹 <span id="val-hunger">60</span><div class="bar-bg"><div id="bar-hunger" class="bar-fill" style="width:60%; background:#ecc94b;"></div></div></div>
    <div>💤睡眠 <span id="val-sleep">30</span><div class="bar-bg"><div id="bar-sleep" class="bar-fill" style="width:30%; background:#9f7aea;"></div></div></div>
    <div>✨充実 <span id="val-fun">50</span><div class="bar-bg"><div id="bar-fun" class="bar-fill" style="width:50%; background:#48bb78;"></div></div></div>
  </div>

  <!-- ロボの思考モニター -->
  <div class="monitor">
    <div class="monitor-header">
      <span>🤖 ロボの思考モニター</span>
      <span id="model-status">待機中</span>
    </div>
    <div id="action-display" class="action-badge">行動: 観察中</div>
    <div id="thought-display" class="thought-box">（ここにAIの生の思考プロセスと行動理由が表示されます）</div>
    <div id="memory-display" class="memory-log">【記憶ログ】まだ記憶はありません。</div>
  </div>

  <!-- 静止フィールド（状態確認用） -->
  <div class="stage">
    <div id="robo-avatar" class="robo">🤖</div>
    <div id="robo-state-text" style="font-size:13px; color:#68d391;">静止して周囲を見渡している</div>
    <div id="field-items" class="field-items">島のアイテム: なし</div>
  </div>

  <!-- アイテム投下＆思考実行 -->
  <div class="controls">
    <button onclick="dropItem('🍎リンゴ')">🍎 リンゴ投下</button>
    <button onclick="dropItem('⛏️ツルハシ')">⛏️ ツルハシ投下</button>
    <button onclick="dropItem('🔥たいまつ')">🔥 たいまつ投下</button>
    <button onclick="dropItem('🪨石ころ')">🪨 石ころ投下</button>
    <button id="think-btn" class="think-btn" onclick="triggerAutonomousStep()">🧠 AIに思考・行動を決定させる</button>
  </div>

  <input type="password" id="api-key" class="api-input" placeholder="Gemini APIキーを入力（ローカル保存されます）" />

<script>
// ==========================================
// 1. ロボットの内部状態と記憶（Single Source of Truth）
// ==========================================
const roboState = {
  stats: {
    hp: 80,       // 体力 (0-100)
    fatigue: 20,  // 疲労 (0-100: 高いほど疲れている)
    hunger: 60,   // 空腹 (0-100: 高いほどお腹が空いている)
    sleep: 30,    // 眠気 (0-100: 高いほど眠い)
    fun: 50       // 充実 (0-100: 高いほど満たされている)
  },
  fieldItems: ['🍎リンゴ'], // 現在島に落ちているもの
  inventory: [],           // ロボが手に持っているもの・作ったもの
  memories: [],            // 過去の思考と行動の記憶（文脈維持に不可欠）
  personality: "好奇心旺盛で少し不器用な自律ロボット。ただ生き延びるだけでなく、アイテムを組み合わせて実験したり、独自の遊びを編み出すのが好き。"
};

// APIキーの復元
const apiKeyInput = document.getElementById('api-key');
apiKeyInput.value = localStorage.getItem('gemini_api_key') || '';
apiKeyInput.addEventListener('change', (e) => localStorage.setItem('gemini_api_key', e.target.value.trim()));

// アイテム投下処理
function dropItem(itemName) {
  roboState.fieldItems.push(itemName);
  updateUI();
  addMemoryLog(`[環境変化] 空から「${itemName}」が落ちてきた。`);
}

// ==========================================
// 2. AIに「本物の思考と行動決定」をさせるスキーマ定義
// ==========================================
// ポイント：最初に「innerThought（内心の葛藤や閃き）」を書かせることで、
// その後の行動決定（action）がテンプレではなく文脈に沿った自由な決定になる。
const decisionSchema = {
  type: "OBJECT",
  properties: {
    perception: {
      type: "STRING",
      description: "自分の体調（空腹や疲労など）と、目の前にあるアイテム・状況に対する客観的な認識"
    },
    innerThought: {
      type: "STRING",
      description: "ロボの頭の中の自由な思考。欲求の葛藤（「お腹は空いているけど、あの石とツルハシで何か作れそう…」など）や、アイテムをどう工夫して使うかの閃きを一人称（ボク/ワタシ等）で記述"
    },
    chosenAction: {
      type: "STRING",
      description: "決定した具体的な行動の短いタイトル（例：「たいまつで焼きリンゴ作り」「石ころを積んでオブジェ制作」「ツルハシで地面を掘って昼寝穴を作る」など自由）"
    },
    actionDetail: {
      type: "STRING",
      description: "その行動をどのように実行し、どんな結果になったかの具体的な描写"
    },
    consumedItems: {
      type: "ARRAY",
      items: { type: "STRING" },
      description: "今回の行動で消費・消滅した島のアイテムや所持品（そのまま残る場合は空配列）"
    },
    createdOrKeptItem: {
      type: "STRING",
      description: "行動の結果、新しく手に入れた・作り出したアイテムや所持したアイテム（なければ空文字）"
    },
    statChanges: {
      type: "OBJECT",
      description: "今回の行動によって変化したステータスの増減値（-30〜+30の範囲）",
      properties: {
        hpDelta: { type: "INTEGER" },
        fatigueDelta: { type: "INTEGER" },
        hungerDelta: { type: "INTEGER" },
        sleepDelta: { type: "INTEGER" },
        funDelta: { type: "INTEGER" }
      },
      required: ["hpDelta", "fatigueDelta", "hungerDelta", "sleepDelta", "funDelta"]
    },
    memorySummary: {
      type: "STRING",
      description: "次回の思考に引き継ぐための、今回の行動と学びの1行要約"
    }
  },
  required: [
    "perception", "innerThought", "chosenAction", "actionDetail",
    "consumedItems", "createdOrKeptItem", "statChanges", "memorySummary"
  ]
};

// ==========================================
// 3. 高負荷（503エラー）に負けないAPI呼び出し（自動モデル切替）
// ==========================================
// メインが混雑していても自動で別モデルにフォールバックして思考を止めない
const MODEL_PRIORITY = [
  "gemini-2.5-flash",
  "gemini-2.5-pro",
  "gemini-2.0-flash"
];

async function callGeminiBrain(promptText, apiKey) {
  let lastError = null;

  for (const modelName of MODEL_PRIORITY) {
    document.getElementById('model-status').textContent = `思考中 (${modelName})...`;
    const url = `https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${apiKey}`;

    try {
      const response = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          contents: [{ parts: [{ text: promptText }] }],
          generationConfig: {
            temperature: 0.9, // 自由な発想・遊びを促すため少し高めに設定
            responseMimeType: "application/json",
            responseSchema: decisionSchema
          }
        })
      });

      if (!response.ok) {
        const errData = await response.json().catch(() => ({}));
        const msg = errData?.error?.message || `HTTP ${response.status}`;
        // High demand (503/429) などの場合は次のモデルへ即座に切り替え
        console.warn(`[${modelName}] 失敗: ${msg}`);
        lastError = msg;
        continue;
      }

      const data = await response.json();
      const rawJson = data.candidates?.[0]?.content?.parts?.[0]?.text;
      document.getElementById('model-status').textContent = `完了 (${modelName})`;
      return JSON.parse(rawJson);

    } catch (err) {
      lastError = err.message;
      continue;
    }
  }
  throw new Error(`全モデル通信失敗: ${lastError}`);
}

// ==========================================
// 4. 自律思考ステップの実行
// ==========================================
async function triggerAutonomousStep() {
  const apiKey = apiKeyInput.value.trim();
  if (!apiKey) {
    alert("Gemini APIキーを入力してください。");
    return;
  }

  const btn = document.getElementById('think-btn');
  btn.disabled = true;

  // AIに渡す現在のワールド状況プロンプト
  const prompt = `
あなたは小さな浮島で暮らす自律型AIロボットです。
プログラムされた固定の選択肢ではなく、あなた自身の意思で考え、目の前のアイテムを工夫して使ったり、自由に遊んだり、休んだりして行動を決定してください。

【あなたの性格】
${roboState.personality}

【現在の体調・ステータス（0〜100）】
- 体力: ${roboState.stats.hp}（低いと動けない）
- 疲労: ${roboState.stats.fatigue}（高いと休みたくなる）
- 空腹: ${roboState.stats.hunger}（高いと何か食べたくなる）
- 眠気: ${roboState.stats.sleep}（高いと眠くなる）
- 充実: ${roboState.stats.fun}（遊びや発見で上がる）

【現在フィールドに落ちているアイテム】
${roboState.fieldItems.length > 0 ? roboState.fieldItems.join("、") : "なし（地面の土や草のみ）"}

【自分が持っている・作ったアイテム】
${roboState.inventory.length > 0 ? roboState.inventory.join("、") : "なし"}

【直近の記憶（過去の自分の行動）】
${roboState.memories.length > 0 ? roboState.memories.slice(-5).join("\n") : "まだ島に降り立ったばかり。"}

【行動決定のルール】
1. 同じ行動ばかり繰り返さず、直近の記憶を踏まえて「次はこれを試してみよう」と発展させてください。
2. アイテムは本来の用途（リンゴを食べる、ツルハシで掘る）だけでなく、複数アイテムの組み合わせ（例：たいまつでリンゴを焼く、石ころとツルハシで火花を出す、リンゴの種を植える等）も自由に発想して構いません。
3. 空腹や疲労が限界（80以上）のときは、生存のための行動を優先するか、それに抗う理由を思考に書いてください。
`;

  try {
    const decision = await callGeminiBrain(prompt, apiKey);
    applyDecisionToWorld(decision);
  } catch (error) {
    document.getElementById('model-status').textContent = "エラー発生";
    document.getElementById('thought-display').textContent = `（思考ノイズ発生…少し頭を冷やしています: ${error.message}）`;
  } finally {
    btn.disabled = false;
  }
}

// ==========================================
// 5. AIの決定をワールドとステータスに反映
// ==========================================
function applyDecisionToWorld(decision) {
  // 1. 思考と行動の表示
  document.getElementById('action-display').textContent = `決定行動: ${decision.chosenAction}`;
  document.getElementById('thought-display').innerHTML = `
    <div style="color:#a0aec0; font-size:12px; margin-bottom:4px;">👁️ 認識: ${decision.perception}</div>
    <div style="color:#fefcbf; font-weight:bold; margin-bottom:6px;">💭 思考: 「${decision.innerThought}」</div>
    <div style="color:#9ae6b4; font-size:13px;">⚡ 実行結果: ${decision.actionDetail}</div>
  `;
  document.getElementById('robo-state-text').textContent = decision.chosenAction;

  // 2. アイテムの消費処理
  if (Array.isArray(decision.consumedItems)) {
    decision.consumedItems.forEach(item => {
      const fIdx = roboState.fieldItems.indexOf(item);
      if (fIdx !== -1) roboState.fieldItems.splice(fIdx, 1);
      const iIdx = roboState.inventory.indexOf(item);
      if (iIdx !== -1) roboState.inventory.splice(iIdx, 1);
    });
  }

  // 3. 新規アイテム・所持品の追加
  if (decision.createdOrKeptItem && decision.createdOrKeptItem.trim() !== "") {
    roboState.inventory.push(decision.createdOrKeptItem.trim());
  }

  // 4. ステータスの更新（0〜100にクランプ）
  const clamp = (val) => Math.max(0, Math.min(100, val));
  const sc = decision.statChanges;
  roboState.stats.hp = clamp(roboState.stats.hp + (sc.hpDelta || 0));
  roboState.stats.fatigue = clamp(roboState.stats.fatigue + (sc.fatigueDelta || 0));
  roboState.stats.hunger = clamp(roboState.stats.hunger + (sc.hungerDelta || 0));
  roboState.stats.sleep = clamp(roboState.stats.sleep + (sc.sleepDelta || 0));
  roboState.stats.fun = clamp(roboState.stats.fun + (sc.funDelta || 0));

  // 5. 記憶の蓄積
  addMemoryLog(`・${decision.memorySummary}`);

  updateUI();
}

function addMemoryLog(text) {
  roboState.memories.push(text);
  const memEl = document.getElementById('memory-display');
  memEl.innerHTML = "<strong>【記憶ログ】</strong><br>" + roboState.memories.slice(-5).reverse().join("<br>");
}

function updateUI() {
  const s = roboState.stats;
  ['hp', 'fatigue', 'hunger', 'sleep', 'fun'].forEach(key => {
    document.getElementById(`val-${key}`).textContent = s[key];
    document.getElementById(`bar-${key}`).style.width = `${s[key]}%`;
  });

  const fieldStr = roboState.fieldItems.length ? roboState.fieldItems.join(' ') : 'なし';
  const invStr = roboState.inventory.length ? ` / 🎒所持・制作物: ${roboState.inventory.join(' ')}` : '';
  document.getElementById('field-items').textContent = `島のアイテム: ${fieldStr}${invStr}`;
}

updateUI();
</script>
</body>
</html>
