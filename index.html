<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI箱庭アイランド</title>
  <style>
    :root { --cell-size: 44px; }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      margin: 12px;
      padding-bottom: 140px;
      background: #141419;
      color: #f0f0f0;
    }
    
    /* ヘッダー */
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .header h2 { margin: 0; font-size: 18px; font-weight: bold; }
    .gear-btn { background: #22222b; border: 1px solid #444; color: #fff; font-size: 14px; padding: 6px 12px; border-radius: 6px; cursor: pointer; }

    /* ステータスバー */
    .status-bar { background: #1c1c24; border: 1px solid #2d2d38; padding: 8px 12px; border-radius: 6px; font-size: 12px; color: #fbbf24; margin-bottom: 10px; min-height: 36px; display: flex; align-items: center; justify-content: space-between; }
    .selected-info { color: #9ca3af; font-family: monospace; }

    /* マップ表示 */
    #world-container {
      min-height: 310px;
      max-height: 48vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a0a0f;
      padding: 16px;
      border-radius: 8px;
      margin-bottom: 12px;
      overflow: auto;
      border: 1px solid #22222e;
    }
    #grid { display: grid; gap: 3px; }
    
    /* マス（海と陸地） */
    .cell {
      width: var(--cell-size);
      height: var(--cell-size);
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      cursor: pointer;
      user-select: none;
      transition: border 0.1s, transform 0.1s;
    }
    .cell.sea { background: #111827; border: 1px dashed #1f2937; color: #374151; font-size: 12px; }
    .cell.land { background: #234d31; border: 1px solid #2e6943; }
    .cell.selected { border: 2px solid #fbbf24 !important; transform: scale(1.05); z-index: 2; box-shadow: 0 0 6px #fbbf24; }

    /* 手帳と履歴パネル */
    .panel { background: #1c1c24; padding: 12px; border-radius: 8px; margin-bottom: 12px; border: 1px solid #2a2a35; }
    h3 { margin: 0 0 8px 0; font-size: 14px; color: #9ca3af; }
    textarea { width: 100%; height: 60px; background: #101015; border: 1px solid #333342; color: #a7f3d0; font-family: monospace; font-size: 12px; border-radius: 6px; padding: 8px; resize: none; }

    .log-container { max-height: 180px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; margin-top: 6px; }
    .log-item { background: #14141a; padding: 8px; border-radius: 6px; border-left: 3px solid #6366f1; font-size: 11px; }
    .log-header { display: flex; justify-content: space-between; color: #818cf8; font-weight: bold; margin-bottom: 2px; }
    .log-thought { color: #d1d5db; margin-bottom: 2px; }
    .log-memo { color: #6ee7b7; font-family: monospace; }

    /* 下部固定フッター */
    .footer-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #181822;
      border-top: 1px solid #333344;
      padding: 10px 12px 14px 12px;
      z-index: 50;
      box-shadow: 0 -4px 16px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    
    /* 1行目：中央揃え大型ボタン */
    .footer-row-1 {
      display: flex;
      justify-content: center;
      width: 100%;
    }
    button.think-btn {
      width: 100%;
      background: #4f46e5;
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 15px;
      padding: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.2s, opacity 0.2s;
    }
    button.think-btn:active { background: #4338ca; }
    button.think-btn:disabled {
      background: #23232c !important;
      color: #6b7280 !important;
      border: 1px solid #333340;
      cursor: not-allowed;
      box-shadow: none;
    }

    /* 2行目：配置・開拓ボタン群 */
    .footer-row-2 { display: flex; gap: 6px; }
    .action-btn {
      flex: 1;
      padding: 10px 4px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: bold;
      border: 1px solid #374151;
      background: #1e1e28;
      color: #9ca3af;
      cursor: pointer;
      transition: all 0.2s;
    }
    .action-btn:disabled {
      opacity: 0.35;
      background: #121218 !important;
      border-color: #222 !important;
      color: #555 !important;
      cursor: not-allowed;
    }
    .action-btn.active-land { background: #065f46; border-color: #059669; color: #a7f3d0; }
    .action-btn.active-tree { background: #166534; border-color: #22c55e; color: #bbf7d0; }
    .action-btn.active-rock { background: #374151; border-color: #6b7280; color: #f3f4f6; }

    /* 設定モーダル */
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.75); justify-content: center; align-items: center; z-index: 100; padding: 16px; }
    .modal-content { background: #20202a; width: 100%; max-width: 360px; padding: 18px; border-radius: 8px; border: 1px solid #3b3b4f; }
    .modal-content h3 { color: #fff; margin-bottom: 12px; font-size: 16px; }
    .modal-content label { font-size: 12px; color: #9ca3af; display: block; margin: 8px 0 4px; }
    .modal-content input, .modal-content select {
      width: 100%;
      padding: 10px;
      background: #121218;
      border: 1px solid #444;
      color: #fff;
      border-radius: 6px;
      margin-bottom: 6px;
      outline: none;
    }
    .modal-content select option:disabled {
      color: #555;
      background: #1a1a22;
    }
    .modal-actions { display: flex; gap: 8px; margin-top: 14px; }
    .modal-actions button { flex: 1; padding: 10px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
    .modal-save { background: #4f46e5; color: white; }
    .modal-close { background: #374151; color: white; }
  </style>
</head>
<body>

  <!-- ヘッダー -->
  <div class="header">
    <h2>🏝 AI箱庭アイランド</h2>
    <button class="gear-btn" onclick="openSettings()">⚙ 設定</button>
  </div>

  <!-- ステータスバー -->
  <div class="status-bar">
    <div id="statusText">マスをタップして選択してください</div>
    <div class="selected-info" id="selectedInfo">未選択</div>
  </div>

  <!-- マップ -->
  <div id="world-container">
    <div id="grid"></div>
  </div>

  <!-- 現在の手帳 -->
  <div class="panel">
    <h3>現在のAI手帳（短期記憶）</h3>
    <textarea id="notebook" readonly></textarea>
  </div>

  <!-- 過去ログ -->
  <div class="panel">
    <h3>過去の行動・思考履歴</h3>
    <div class="log-container" id="logContainer">
      <div style="font-size: 12px; color: #4b5563;">まだ履歴はありません。</div>
    </div>
  </div>

  <!-- 下部固定フッター -->
  <div class="footer-bar">
    <!-- 1行目：中央揃え大型ボタン（時間帯制御） -->
    <div class="footer-row-1">
      <button class="think-btn" id="thinkBtn" onclick="thinkAndAct()">今すぐ考えさせる</button>
    </div>

    <!-- 2行目：配置・開拓ボタン群 -->
    <div class="footer-row-2">
      <button class="action-btn" id="btnExpand" disabled onclick="expandSelectedCell()">🌱 土地拡張</button>
      <button class="action-btn" id="btnAddTree" disabled onclick="addSelectedItem('木')">🌲 木</button>
      <button class="action-btn" id="btnAddRock" disabled onclick="addSelectedItem('石')">🪨 石</button>
    </div>
  </div>

  <!-- 設定モーダル -->
  <div class="modal-overlay" id="settingsModal">
    <div class="modal-content">
      <h3>設定</h3>
      
      <!-- APIキー入力 -->
      <label>Gemini APIキー</label>
      <input type="password" id="modalApiKey" placeholder="AIzaSy...">
      
      <!-- モデル選択（モーダル内へ移動） -->
      <label>使用モデル</label>
      <select id="modalModelSelect">
        <option value="gemini-3.8-flash" selected>Gemini 3.8 Flash（標準・推奨）</option>
      </select>

      <!-- 稼働方式ドロップダウン -->
      <label>稼働方式</label>
      <select id="modalApproachSelect">
        <option value="approach1" selected>アプローチ1：お留守番方式（推奨）</option>
        <option value="approach2" disabled>アプローチ2：24時間裏稼働（準備中・暗転）</option>
      </select>
      
      <div class="modal-actions">
        <button class="modal-save" onclick="saveSettingsFromModal()">保存</button>
        <button class="modal-close" onclick="closeSettings()">閉じる</button>
      </div>
    </div>
  </div>

  <script>
    const GRID_SIZE = 6;
    let state = {
      land: [
        { x: 2, y: 2 }, { x: 3, y: 2 },
        { x: 2, y: 3 }, { x: 3, y: 3 }
      ],
      agent: { x: 2, y: 2, icon: "🤖" },
      items: [
        { id: 1, name: '木', icon: '🌲', x: 2, y: 3 },
        { id: 2, name: '石', icon: '🪨', x: 3, y: 2 }
      ],
      notebook: "ここは海に囲まれた小さな島だ。周囲の未開拓な海を観察している。",
      logs: [],
      selected: null
    };

    window.onload = () => {
      const savedKey = localStorage.getItem('gemini_api_key');
      if (savedKey) document.getElementById('modalApiKey').value = savedKey;

      renderGrid();
      updateButtons();
      checkTimeRestriction();
      setInterval(checkTimeRestriction, 30000); // 30秒ごとに時間帯チェック

      // アプローチ1：お留守番時間の確認と手帳自動補完
      checkAwayTime();
    };

    // 10:00〜18:00の時間制限判定
    function checkTimeRestriction() {
      const now = new Date();
      const hour = now.getHours();
      const thinkBtn = document.getElementById('thinkBtn');

      // 10:00〜18:00の間のみ活性化
      const isDaytime = hour >= 10 && hour < 18;

      if (isDaytime) {
        thinkBtn.disabled = false;
        thinkBtn.innerText = "今すぐ考えさせる";
      } else {
        thinkBtn.disabled = true;
        thinkBtn.innerText = `💤 睡眠中（活動は10:00〜18:00 / 現在${hour}時）`;
      }
    }

    // アプローチ1：不在時の思考補完
    async function checkAwayTime() {
      const now = Date.now();
      const lastActive = localStorage.getItem('last_active_timestamp');
      localStorage.setItem('last_active_timestamp', now);

      if (!lastActive) return;

      const elapsedHours = Math.floor((now - parseInt(lastActive)) / (1000 * 60 * 60));
      if (elapsedHours >= 1) {
        setStatus(`前回の確認から約${elapsedHours}時間経過：留守中の様子を手帳にまとめます...`);
        
        const apiKey = localStorage.getItem('gemini_api_key');
        if (!apiKey) return;

        const prompt = `
あなたは箱庭の島にいる自律AIロボットです。
プレイヤーが離れてから約${elapsedHours}時間が経過しました。
その間、あなたは島で静かに過ごし、周囲を観察したり休息していました。
現在の島の手帳（記憶）: "${state.notebook}"

この留守番中の静かな思考や変化を踏まえ、手帳の内容を更新してください。
以下のJSONフォーマットのみを出力してください。
{"notebook": "更新された手帳内容", "thought": "留守番中に考えていたことの要約"}
        `.trim();

        try {
          const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=${apiKey}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
          });
          const data = await res.json();
          if (!data.error) {
            const rawText = data.candidates[0].content.parts[0].text;
            const clean = rawText.replace(/```json/g, '').replace(/```/g, '').trim();
            const result = JSON.parse(clean);
            state.notebook = result.notebook;
            addLog(`留守番(${elapsedHours}時間)`, result.thought, result.notebook, "Gemini 3.8 Flash");
            renderGrid();
            setStatus(`留守中の手帳を更新しました（${elapsedHours}時間経過）`);
          }
        } catch (e) {
          console.log("留守番思考のスキップ:", e);
        }
      }
    }

    function isLandAt(x, y) {
      return state.land.some(l => l.x === x && l.y === y);
    }

    function selectCell(x, y) {
      if (state.selected && state.selected.x === x && state.selected.y === y) {
        state.selected = null;
      } else {
        state.selected = { x, y };
      }
      renderGrid();
      updateButtons();
    }

    function updateButtons() {
      const btnExpand = document.getElementById('btnExpand');
      const btnTree = document.getElementById('btnAddTree');
      const btnRock = document.getElementById('btnAddRock');
      const info = document.getElementById('selectedInfo');

      btnExpand.className = 'action-btn';
      btnTree.className = 'action-btn';
      btnRock.className = 'action-btn';

      if (!state.selected) {
        btnExpand.disabled = true;
        btnTree.disabled = true;
        btnRock.disabled = true;
        info.innerText = "未選択";
        return;
      }

      const { x, y } = state.selected;
      const isLand = isLandAt(x, y);

      info.innerText = `(${x},${y}) ${isLand ? '陸地' : '海'}`;

      if (!isLand) {
        btnExpand.disabled = false;
        btnExpand.classList.add('active-land');
        btnTree.disabled = true;
        btnRock.disabled = true;
      } else {
        btnExpand.disabled = true;
        btnTree.disabled = false;
        btnTree.classList.add('active-tree');
        btnRock.disabled = false;
        btnRock.classList.add('active-rock');
      }
    }

    function expandSelectedCell() {
      if (!state.selected) return;
      const { x, y } = state.selected;
      if (isLandAt(x, y)) return;

      state.land.push({ x, y });
      setStatus(`(${x}, ${y}) を開拓して陸地にしました`);
      renderGrid();
      updateButtons();
    }

    function addSelectedItem(type) {
      if (!state.selected) return;
      const { x, y } = state.selected;

      if (!isLandAt(x, y)) {
        return alert("海の上には設置できません。先に土地拡張をしてください。");
      }
      if (state.agent.x === x && state.agent.y === y) {
        return alert("AIロボットがいるマスには設置できません。");
      }
      const existing = state.items.find(i => i.x === x && i.y === y);
      if (existing) {
        return alert(`ここにはすでに【${existing.name}】があります。`);
      }

      const icon = type === '木' ? '🌲' : '🪨';
      state.items.push({ id: Date.now(), name: type, icon, x, y });
      setStatus(`(${x}, ${y}) に【${type}】を配置しました`);
      renderGrid();
      updateButtons();
    }

    function renderGrid() {
      const grid = document.getElementById('grid');
      grid.style.gridTemplateColumns = `repeat(${GRID_SIZE}, var(--cell-size))`;
      grid.innerHTML = '';

      for (let y = 0; y < GRID_SIZE; y++) {
        for (let x = 0; x < GRID_SIZE; x++) {
          const cell = document.createElement('div');
          const isLand = isLandAt(x, y);
          const isSelected = state.selected && state.selected.x === x && state.selected.y === y;

          cell.className = `cell ${isLand ? 'land' : 'sea'} ${isSelected ? 'selected' : ''}`;
          cell.onclick = () => selectCell(x, y);

          if (isLand) {
            if (state.agent.x === x && state.agent.y === y) {
              cell.innerText = state.agent.icon;
            } else {
              const item = state.items.find(i => i.x === x && i.y === y);
              if (item) cell.innerText = item.icon;
            }
          } else {
            cell.innerText = '·';
          }

          grid.appendChild(cell);
        }
      }
      document.getElementById('notebook').value
