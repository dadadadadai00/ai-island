<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ボクセルAI観察記</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    body { background: #0b0c10; color: #c5c6c7; font-family: -apple-system, BlinkMacSystemFont, sans-serif; overflow: hidden; height: 100vh; display: flex; flex-direction: column; }
    
    /* 5ゲージヘッダー */
    .header { background: rgba(15,16,24,0.95); padding: 6px 10px; border-bottom: 1px solid #1f2833; z-index: 100; font-size: 11px; }
    .status-row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; margin-bottom: 4px; }
    .gauge-wrap { display: flex; flex-direction: column; gap: 2px; }
    .gauge-label { font-size: 9px; color: #8892b0; text-align: center; }
    .gauge-bar { height: 6px; background: #1c2030; border-radius: 3px; overflow: hidden; }
    .gauge-fill { height: 100%; width: 50%; transition: width 0.4s ease, background 0.4s; }
    .sub-bar { display: flex; justify-content: space-between; align-items: center; font-size: 11px; }

    /* 3Dステージ＆虫眼鏡 */
    #stage-container { position: relative; flex: 1; width: 100%; overflow: hidden; background: #000; }
    #c3d { width: 100%; height: 100%; display: block; }
    
    /* 虫眼鏡レンズ枠（CSSグラデーションでGPU負荷ゼロ） */
    .lens-overlay {
      position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity 0.4s;
      background: radial-gradient(circle at center, transparent 32%, rgba(5,7,12,0.6) 55%, rgba(0,0,0,0.92) 80%);
      box-shadow: inset 0 0 40px rgba(0,0,0,0.8);
    }
    .lens-overlay.active { opacity: 1; }
    .lens-rim {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 240px; height: 240px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.15);
      pointer-events: none; opacity: 0; transition: opacity 0.4s;
    }
    .lens-overlay.active .lens-rim { opacity: 1; }

    /* カメラ切替ボタン群 */
    .cam-controls { position: absolute; top: 8px; right: 8px; display: flex; flex-direction: column; gap: 6px; z-index: 50; }
    .cam-btn {
      background: rgba(31, 40, 51, 0.85); color: #66fcf1; border: 1px solid #45a29e;
      padding: 6px 10px; border-radius: 16px; font-size: 11px; font-weight: bold; cursor: pointer;
    }
    .cam-btn.active { background: #45a29e; color: #0b0c10; }

    /* ドラマ・操作ボトムシート */
    .bottom-sheet { background: #12141d; border-top: 1px solid #1f2833; padding: 8px 10px; display: flex; flex-direction: column; gap: 6px; z-index: 100; max-height: 42vh; }
    .story-box {
      background: #0d0e15; border: 1px solid #232936; border-radius: 8px; padding: 6px 10px;
      font-size: 12px; line-height: 1.4; color: #e6f1ff; min-height: 48px; max-height: 68px; overflow-y: auto;
    }
    .story-tag { color: #66fcf1; font-weight: bold; margin-right: 4px; }
    
    .item-select { display: flex; gap: 6px; justify-content: space-between; }
    .item-btn {
      flex: 1; padding: 6px 0; background: #1a1e2d; border: 1px solid #30384d; border-radius: 6px;
      color: #fff; font-size: 11px; display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer;
    }
    .item-btn.selected { border-color: #66fcf1; background: #202b3c; }

    .action-row { display: flex; gap: 8px; }
    .act-btn {
      flex: 1; padding: 9px 0; background: linear-gradient(135deg, #45a29e, #66fcf1);
      border: none; border-radius: 8px; color: #0b0c10; font-weight: bold; font-size: 13px; cursor: pointer;
    }
    .act-btn:disabled { background: #333; color: #777; }
    .sub-btn { background: #1f2833; color: #c5c6c7; border: 1px solid #30384d; padding: 0 12px; border-radius: 8px; font-size: 11px; }

    /* モーダル */
    .modal {
      position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none;
      align-items: center; justify-content: center; z-index: 200; padding: 20px;
    }
    .modal-card { background: #161925; border: 1px solid #30384d; border-radius: 12px; padding: 14px; width: 100%; max-width: 320px; }
    .modal-title { font-size: 14px; color: #66fcf1; margin-bottom: 8px; font-weight: bold; }
    .diary-text { font-size: 12px; line-height: 1.5; color: #ddd; background: #0d0f18; padding: 10px; border-radius: 6px; max-height: 160px; overflow-y: auto; white-space: pre-wrap; }
    .close-btn { width: 100%; margin-top: 10px; padding: 8px; background: #1f2833; border: 1px solid #45a29e; color: #fff; border-radius: 6px; }
    input[type="password"] { width: 100%; padding: 8px; background: #0d0f18; border: 1px solid #30384d; color: #fff; border-radius: 6px; margin: 8px 0; font-size: 12px; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <!-- 5ゲージ -->
  <div class="header">
    <div class="status-row">
      <div class="gauge-wrap"><div class="gauge-label">❤️体力</div><div class="gauge-bar"><div class="gauge-fill" id="g-hp" style="background:#ef4444;"></div></div></div>
      <div class="gauge-wrap"><div class="gauge-label">☕疲労</div><div class="gauge-bar"><div class="gauge-fill" id="g-fatigue" style="background:#f59e0b;"></div></div></div>
      <div class="gauge-wrap"><div class="gauge-label">🍖空腹</div><div class="gauge-bar"><div class="gauge-fill" id="g-hunger" style="background:#eab308;"></div></div></div>
      <div class="gauge-wrap"><div class="gauge-label">💤睡眠</div><div class="gauge-bar"><div class="gauge-fill" id="g-sleep" style="background:#8b5cf6;"></div></div></div>
      <div class="gauge-wrap"><div class="gauge-label">✨充実</div><div class="gauge-bar"><div class="gauge-fill" id="g-morale" style="background:#10b981;"></div></div></div>
    </div>
    <div class="sub-bar">
      <span>性格: <b id="ui-trait" style="color:#66fcf1;">てんねん</b></span>
      <span>活動残: <b id="ui-energy">20</b> / 20回</span>
    </div>
  </div>

  <!-- 3D表示部 -->
  <div id="stage-container">
    <div id="c3d"></div>
    <div class="lens-overlay" id="lensOverlay"><div class="lens-rim"></div></div>
    <div class="cam-controls">
      <button class="cam-btn active" onclick="setCameraMode('high')">🌲 地上全景</button>
      <button class="cam-btn" onclick="setCameraMode('low')">🔍 虫眼鏡(地)</button>
      <button class="cam-btn" onclick="setCameraMode('underground')">⛏️ アリの巣(下)</button>
    </div>
  </div>

  <!-- 操作部 -->
  <div class="bottom-sheet">
    <div class="story-box" id="storyBox">
      <span class="story-tag">[朝の目覚め]</span>机の上の日記を読んだ。今日もお化けが出る気配がする…
    </div>

    <div class="item-select">
      <div class="item-btn selected" onclick="selectItem('🍎 リンゴ', this)"><span>🍎</span><span>リンゴ</span></div>
      <div class="item-btn" onclick="selectItem('🪢 ロープ', this)"><span>🪢</span><span>ロープ</span></div>
      <div class="item-btn" onclick="selectItem('🔥 たいまつ', this)"><span>🔥</span><span>たいまつ</span></div>
      <div class="item-btn" onclick="selectItem('🪨 石ころ', this)"><span>🪨</span><span>石ころ</span></div>
    </div>

    <div class="action-row">
      <button class="act-btn" id="actBtn" onclick="dispatchAction()">運命を見届ける (差し入れ)</button>
      <button class="sub-btn" onclick="openDiary()">📖 日記</button>
      <button class="sub-btn" onclick="openKeyModal()">⚙️</button>
    </div>
  </div>

  <!-- 日記モーダル -->
  <div class="modal" id="diaryModal">
    <div class="modal-card">
      <div class="modal-title">📖 記録された日記</div>
      <div class="diary-text" id="diaryContent">昨日の日記はまだ白紙だ。</div>
      <button class="close-btn" onclick="closeDiary()">閉じる</button>
    </div>
  </div>

  <!-- APIキー設定モーダル -->
  <div class="modal" id="keyModal">
    <div class="modal-card">
      <div class="modal-title">⚙️ Gemini API設定</div>
      <div style="font-size:11px;color:#8892b0;">キーを入力すると本物のGemini思考で動きます（空欄の場合は内蔵AIが作動）。</div>
      <input type="password" id="keyInput" placeholder="AIzaSy...">
      <div style="display:flex;gap:6px;">
        <button class="act-btn" style="flex:1;" onclick="saveKey()">保存</button>
        <button class="sub-btn" onclick="closeKeyModal()">キャンセル</button>
      </div>
    </div>
  </div>

  <script>
    // --- ゲーム状態管理 ---
    const STATE = {
      trait: 'てんねん',
      hp: 80, fatigue: 20, hunger: 30, sleep: 20, morale: 70,
      energy: 20,
      selectedItem: '🍎 リンゴ',
      diary: '1日目：島にぽつんと目が覚めた。頭がぼんやりしている。',
      location: 'surface', // 'surface' or 'underground'
      isBusy: false
    };

    // --- Three.js 初期化（断面構造＆軽量インスタンス） ---
    const container = document.getElementById('c3d');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x08090f);

    const camera = new THREE.PerspectiveCamera(42, container.clientWidth / container.clientHeight, 0.1, 100);
    const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'low-power' });
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    const ambLight = new THREE.AmbientLight(0xffffff, 0.65);
    scene.add(ambLight);
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.7);
    dirLight.position.set(10, 20, 10);
    scene.add(dirLight);

    // マップ構築（10x10・地下-6層まで断面カット）
    const boxGeo = new THREE.BoxGeometry(0.94, 0.94, 0.94);
    const matGrass = new THREE.MeshLambertMaterial({ color: 0x48bb78 });
    const matDirt = new THREE.MeshLambertMaterial({ color: 0x8b5a2b });
    const matStone = new THREE.MeshLambertMaterial({ color: 0x4a5568 });
    const matOre = new THREE.MeshLambertMaterial({ color: 0x38bdf8 });

    const mapGroup = new THREE.Group();
    scene.add(mapGroup);

    // 水槽断面演出：手前半分(z > 1)を掘り抜いて内部を露出
    for (let x = -4; x <= 4; x++) {
      for (let z = -4; z <= 4; z++) {
        // 地表
        const topBlock = new THREE.Mesh(boxGeo, matGrass);
        topBlock.position.set(x, 0, z);
        mapGroup.add(topBlock);

        // 地下層 (-1 〜 -6)
        for (let y = -1; y >= -6; y--) {
          // 手前壁は切り落としてアリの巣状に内部を見せる
          if (z >= 1) continue; 
          // 地下小部屋（空洞）を作る
          if (y >= -4 && y <= -2 && Math.abs(x) <= 2 && z <= -1) continue;

          let mat = matStone;
          if (y >= -2) mat = matDirt;
          else if (x === 0 && y === -5) mat = matOre;

          const b = new THREE.Mesh(boxGeo, mat);
          b.position.set(x, y, z);
          mapGroup.add(b);
        }
      }
    }

    // --- キャラクター構築（頭・胴体・両腕・両足・靴・手持ちアイテム） ---
    const chara = new THREE.Group();
    scene.add(chara);

    // 胴体
    const bodyM = new THREE.Mesh(boxGeo, new THREE.MeshLambertMaterial({ color: 0x3b82f6 }));
    bodyM.scale.set(0.55, 0.55, 0.4);
    bodyM.position.y = 0.55;
    chara.add(bodyM);

    // 頭
    const headM = new THREE.Mesh(boxGeo, new THREE.MeshLambertMaterial({ color: 0x93c5fd }));
    headM.scale.set(0.48, 0.45, 0.45);
    headM.position.y = 0.95;
    chara.add(headM);

    // 腕（左右）
    const armGeo = new THREE.BoxGeometry(0.18, 0.42, 0.18);
    const armMat = new THREE.MeshLambertMaterial({ color: 0x2563eb });
    const rightArm = new THREE.Mesh(armGeo, armMat);
    rightArm.position.set(0.38, 0.55, 0);
    chara.add(rightArm);
    const leftArm = new THREE.Mesh(armGeo, armMat);
    leftArm.position.set(-0.38, 0.55, 0);
    chara.add(leftArm);

    // 手持ちアイテムスロット（右腕の子）
    const itemSlot = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.2, 0.2), new THREE.MeshLambertMaterial({ color: 0xef4444 }));
    itemSlot.position.set(0, -0.25, 0.15);
    rightArm.add(itemSlot);

    // 足・靴（左右）
    const legGeo = new THREE.BoxGeometry(0.2, 0.35, 0.2);
    const bootGeo = new THREE.BoxGeometry(0.22, 0.15, 0.28);
    const legMat = new THREE.MeshLambertMaterial({ color: 0x1e3a8a });
    const bootMat = new THREE.MeshLambertMaterial({ color: 0x78350f });

    const rightLegGroup = new THREE.Group();
    rightLegGroup.position.set(0.18, 0.3, 0);
    const rLeg = new THREE.Mesh(legGeo, legMat);
    const rBoot = new THREE.Mesh(bootGeo, bootMat);
    rBoot.position.set(0, -0.15, 0.04);
    rightLegGroup.add(rLeg, rBoot);
    chara.add(rightLegGroup);

    const leftLegGroup = new THREE.Group();
    leftLegGroup.position.set(-0.18, 0.3, 0);
    const lLeg = new THREE.Mesh(legGeo, legMat);
    const lBoot = new THREE.Mesh(bootGeo, bootMat);
    lBoot.position.set(0, -0.15, 0.04);
    leftLegGroup.add(lLeg, lBoot);
    chara.add(leftLegGroup);

    // お化け（半透明の浮遊ボクセル）
    const ghost = new THREE.Mesh(
      new THREE.BoxGeometry(0.65, 0.85, 0.65),
      new THREE.MeshLambertMaterial({ color: 0xf1f5f9, transparent: true, opacity: 0.75 })
    );
    ghost.position.set(2, 1.2, 1);
    scene.add(ghost);

    // --- カメラプリセット ---
    const CAM_PRESETS = {
      high: { pos: new THREE.Vector3(10, 12, 11), look: new THREE.Vector3(0, 0, 0), lens: false },
      low: { pos: new THREE.Vector3(2.5, 1.4, 3.5), look: new THREE.Vector3(0, 0.6, 0), lens: true },
      underground: { pos: new THREE.Vector3(0, -3, 5), look: new THREE.Vector3(0, -3.2, -1), lens: true }
    };
    let currentCam = 'high';
    let targetCamPos = CAM_PRESETS.high.pos.clone();
    let targetCamLook = CAM_PRESETS.high.look.clone();
    let curCamLook = targetCamLook.clone();
    camera.position.copy(targetCamPos);

    function setCameraMode(mode) {
      currentCam = mode;
      targetCamPos.copy(CAM_PRESETS[mode].pos);
      targetCamLook.copy(CAM_PRESETS[mode].look);

      document.querySelectorAll('.cam-btn').forEach((b, i) => {
        b.classList.toggle('active', (i === 0 && mode === 'high') || (i === 1 && mode === 'low') || (i === 2 && mode === 'underground'));
      });
      document.getElementById('lensOverlay').classList.toggle('active', CAM_PRESETS[mode].lens);
    }

    // --- アニメーション＆省エネ描画制御 ---
    let animClock = 0;
    let isMoving = false;
    let charaTargetY = 0.5;

    function renderLoop() {
      requestAnimationFrame(renderLoop);
      animClock += 0.035;

      // カメラのスムーズ追従
      camera.position.lerp(targetCamPos, 0.06);
      curCamLook.lerp(targetCamLook, 0.06);
      camera.lookAt(curCamLook);

      // お化けの浮遊
      ghost.position.y = (STATE.location === 'surface' ? 1.0 : -2.5) + Math.sin(animClock * 1.5) * 0.2;

      // キャラクターのアニメーション（待機・歩行）
      chara.position.y += (charaTargetY - chara.position.y) * 0.1;
      if (isMoving) {
        rightArm.rotation.x = Math.sin(animClock * 6) * 0.7;
        leftArm.rotation.x = -Math.sin(animClock * 6) * 0.7;
        rightLegGroup.rotation.x = -Math.sin(animClock * 6) * 0.7;
        leftLegGroup.rotation.x = Math.sin(animClock * 6) * 0.7;
      } else {
        // 呼吸
        bodyM.scale.y = 0.55 + Math.sin(animClock * 2) * 0.02;
        rightArm.rotation.x = 0; leftArm.rotation.x = 0;
        rightLegGroup.rotation.x = 0; leftLegGroup.rotation.x = 0;
      }

      renderer.render(scene, camera);
    }
    renderLoop();

    // --- UI更新 ---
    function updateUI() {
      document.getElementById('g-hp').style.width = STATE.hp + '%';
      document.getElementById('g-fatigue').style.width = STATE.fatigue + '%';
      document.getElementById('g-hunger').style.width = STATE.hunger + '%';
      document.getElementById('g-sleep').style.width = STATE.sleep + '%';
      document.getElementById('g-morale').style.width = STATE.morale + '%';
      document.getElementById('ui-energy').innerText = STATE.energy;
      document.getElementById('ui-trait').innerText = STATE.trait;
      document.getElementById('actBtn').disabled = STATE.energy <= 0 || STATE.isBusy;
    }
    updateUI();

    function selectItem(name, el) {
      STATE.selectedItem = name;
      document.querySelectorAll('.item-btn').forEach(b => b.classList.remove('selected'));
      el.classList.add('selected');
      
      // アイテムの色変化
      const colors = { '🍎 リンゴ': 0xef4444, '🪢 ロープ': 0xd97706, '🔥 たいまつ': 0xf59e0b, '🪨 石ころ': 0x64748b };
      itemSlot.material.color.setHex(colors[name] || 0xffffff);
    }

    // --- AI思考＆ドラマ解決実行 ---
    async function dispatchAction() {
      if (STATE.isBusy || STATE.energy <= 0) return;
      STATE.isBusy = true;
      STATE.energy--;
      updateUI();

      const storyEl = document.getElementById('storyBox');
      storyEl.innerHTML = `<span class="story-tag">[思考中]</span>${STATE.trait}なAIが${STATE.selectedItem}を見て考えを巡らせています...`;

      isMoving = true;
      const apiKey = localStorage.getItem('gemini_api_key');
      let result = null;

      if (apiKey) {
        result = await callGemini(apiKey);
      } else {
        result = getMockDrama();
      }

      // 演出再生
      setTimeout(() => {
        isMoving = false;
        storyEl.innerHTML = `<span class="story-tag">[結果]</span>${result.story}`;
        
        // ゲージ反映
        STATE.hp = Math.max(0, Math.min(100, STATE.hp + result.delta.hp));
        STATE.fatigue = Math.max(0, Math.min(100, STATE.fatigue + result.delta.fatigue));
        STATE.hunger = Math.max(0, Math.min(100, STATE.hunger + result.delta.hunger));
        STATE.sleep = Math.max(0, Math.min(100, STATE.sleep + result.delta.sleep));
        STATE.morale = Math.max(0, Math.min(100, STATE.morale + result.delta.morale));

        // 場所移動演出
        if (result.move === 'underground') {
          STATE.location = 'underground';
          charaTargetY = -3.2;
          chara.position.set(0, -3.2, -1);
          setCameraMode('underground');
        } else {
          STATE.location = 'surface';
          charaTargetY = 0.5;
          chara.position.set(0, 0.5, 0);
        }

        // 日記追記
        STATE.diary += `\n・${result.story}`;
        STATE.isBusy = false;
        updateUI();

        // 20回使い切り＝1日終了
        if (STATE.energy === 0) {
          triggerDayEnd();
        }
      }, 1500);
    }

    // 内蔵モック思考（APIキー無しでも即遊べる設計）
    function getMockDrama() {
      const dramas = {
        '🍎 リンゴ': [
          { story: 'お化けにリンゴを差し出したが、自分が空腹すぎて半分かじってしまい、お化けと一緒に仲良く食べた。', delta: { hp: 5, hunger: -25, morale: 15, fatigue: 5, sleep: 5 }, move: 'surface' },
          { story: 'リンゴを全力投球！お化けをすり抜けて地面の穴に落ち、追いかけて地下の巣穴へ避難した。', delta: { hp: -5, hunger: 10, morale: -5, fatigue: 15, sleep: 10 }, move: 'underground' }
        ],
        '🪢 ロープ': [
          { story: 'ロープでお化けを捕まえようとしたが、自分が絡まってミノムシ状態になり地下へ転がり落ちた。', delta: { hp: -10, fatigue: 20, morale: -10, sleep: 10, hunger: 10 }, move: 'underground' },
          { story: 'ロープを巧みに操り、上空の木に引っ掛けてお化けの頭上を飛び越えて地上を脱出した！', delta: { hp: 0, fatigue: 15, morale: 25, sleep: 5, hunger: 15 }, move: 'surface' }
        ],
        '🔥 たいまつ': [
          { story: 'たいまつを掲げて威嚇！お化けは光に驚いて逃げ去り、暗い地下室を明るく照らしてくつろいだ。', delta: { hp: 0, morale: 20, fatigue: 5, sleep: 15, hunger: 5 }, move: 'underground' }
        ],
        '🪨 石ころ': [
          { story: '石をおにぎりと勘違いしてお化けにプレゼント。お化けは困惑しながらも頭を撫でて消えた。', delta: { hp: 0, morale: 15, fatigue: -5, sleep: 5, hunger: 10 }, move: 'surface' }
        ]
      };
      const list = dramas[STATE.selectedItem] || dramas['🍎 リンゴ'];
      return list[Math.floor(Math.random() * list.length)];
    }

    // 本物Gemini API連携
    async function callGemini(key) {
      const prompt = `あなたは「${STATE.trait}」な性格の自律ロボットです。
状態: 体力=${STATE.hp}, 疲労=${STATE.fatigue}, 空腹=${STATE.hunger}, 睡眠不足=${STATE.sleep}, 充実=${STATE.morale}。
現在地: ${STATE.location}。お化けが出現しました。
人間から【${STATE.selectedItem}】を受け取りました。
このアイテムをどう解釈し、どんなドタバタ劇や物理的な解決をしてどうなったか、結果をショートストーリー(60文字程度)にし、各ゲージの増減値(-30〜+30)と次の位置("surface"または"underground")をJSON形式のみで出力してください。
フォーマット: {"story":"...", "delta":{"hp":0,"fatigue":0,"hunger":0,"sleep":0,"morale":0}, "move":"surface"}`;

      try {
        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${key}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
        });
        const data = await res.json();
        const raw = data.candidates[0].content.parts[0].text;
        const jsonStr = raw.match(/\{[\s\S]*\}/)[0];
        return JSON.parse(jsonStr);
      } catch (e) {
        return getMockDrama();
      }
    }

    // 1日終了・記憶リセット処理
    function triggerDayEnd() {
      setTimeout(() => {
        alert('🌙 バッテリーが切れました。今日の日記を書き残して記憶をリセットします...');
        openDiary();
        // 翌日初期化
        STATE.energy = 20;
        STATE.fatigue = 10;
        STATE.sleep = 0;
        STATE.hunger = 40;
        updateUI();
      }, 1000);
    }

    // モーダル操作
    function openDiary() {
      document.getElementById('diaryContent').innerText = STATE.diary;
      document.getElementById('diaryModal').style.display = 'flex';
    }
    function closeDiary() { document.getElementById('diaryModal').style.display = 'none'; }
    function openKeyModal() {
      document.getElementById('keyInput').value = localStorage.getItem('gemini_api_key') || '';
      document.getElementById('keyModal').style.display = 'flex';
    }
    function closeKeyModal() { document.getElementById('keyModal').style.display = 'none'; }
    function saveKey() {
      localStorage.setItem('gemini_api_key', document.getElementById('keyInput').value.trim());
      closeKeyModal();
    }

    // 画面リサイズ追従
    window.addEventListener('resize', () => {
      camera.aspect = container.clientWidth / container.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(container.clientWidth, container.clientHeight);
    });
  </script>
</body>
