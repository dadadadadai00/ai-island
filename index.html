<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>キャラクター骨組みテスト</title>
  <style>
    * { box-sizing: border-box; user-select: none; margin: 0; padding: 0; }
    body {
      background: #12131a; color: #eee; font-family: sans-serif;
      display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 12px;
    }
    h2 { font-size: 15px; color: #818cf8; margin-bottom: 8px; }

    /* ステージ台座（斜め立体） */
    .stage {
      width: 220px; height: 180px; position: relative;
      display: flex; align-items: center; justify-content: center;
      perspective: 600px; margin-bottom: 12px;
    }
    .pedestal {
      width: 140px; height: 140px; background: #222538;
      border: 3px solid #3b4261; border-radius: 20px;
      transform: rotateX(60deg) rotateZ(-45deg);
      box-shadow: 0 10px 0 #181926, 0 20px 25px rgba(0,0,0,0.5);
    }
    .shadow {
      position: absolute; bottom: 35px; width: 60px; height: 24px;
      background: rgba(0,0,0,0.4); border-radius: 50%;
      filter: blur(2px); transition: all 0.2s;
    }

    /* キャラクター本体 */
    .chara-root {
      position: absolute; bottom: 45px; width: 64px; height: 80px;
      display: flex; flex-direction: column; align-items: center;
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    /* 向き（4方向の反転・角度） */
    .dir-front-left { transform: scaleX(1); }
    .dir-front-right { transform: scaleX(-1); }
    .dir-back-left { transform: scaleX(1) scaleY(0.95); filter: brightness(0.85); }
    .dir-back-right { transform: scaleX(-1) scaleY(0.95); filter: brightness(0.85); }

    /* 各スロットの構造 */
    .slot-hat { position: absolute; top: -18px; font-size: 24px; z-index: 10; transition: transform 0.15s; }
    .head {
      width: 48px; height: 42px; background: linear-gradient(135deg, #60a5fa, #3b82f6);
      border-radius: 14px; position: relative; display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 0 #1d4ed8; z-index: 5;
    }
    .slot-face { font-size: 20px; }
    .body {
      width: 38px; height: 32px; background: linear-gradient(135deg, #e2e8f0, #cbd5e1);
      border-radius: 10px; margin-top: -4px; position: relative;
      box-shadow: 0 3px 0 #94a3b8; z-index: 4;
    }
    .slot-right-hand {
      position: absolute; left: -14px; top: 6px; font-size: 20px;
      transform-origin: top right; z-index: 6;
    }
    .slot-backpack { position: absolute; right: -12px; top: 4px; font-size: 20px; z-index: 2; }
