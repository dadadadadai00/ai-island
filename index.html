<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>生命の種 - ミニAI観察水槽</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: #121820;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", "Meiryo", sans-serif;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* 上部：3Dプレビュー画面エリア */
    #view-container {
      position: relative;
      width: 100%;
      height: 52%;
      background: linear-gradient(to bottom, #87ceeb 0%, #e0f6ff 100%);
      overflow: hidden;
    }

    #canvas3d {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* 右上の設定ボタン */
    #settings-btn {
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 10;
      background: rgba(255, 255, 255, 0.85);
      border: none;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
    }

    /* プレビュー内の上部ゲージ群 */
    #hud {
      position: absolute;
      top: 10px;
      left: 12px;
      right: 60px;
      z-index: 5;
      display: flex;
      flex-direction: column;
      gap: 6px;
      pointer-events: none;
    }

    /* コアの3本並列ゲージ */
    .core-gauges {
      display: flex;
      gap: 6px;
      width: 100%;
    }

    .gauge-col {
      flex: 1;
      background: rgba(0, 0, 0, 0.55);
      padding: 4px 6px;
      border-radius: 8px;
      backdrop-filter: blur(4px);
    }

    .gauge-label {
      font-size: 10px;
      font-weight: bold;
      display: flex;
      justify-content: space-between;
      margin-bottom: 2px;
    }

    .bar-bg {
      background: rgba(255, 255, 255, 0.2);
      height: 6px;
      border-radius: 3px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      width: 100%;
      transition: width 0.3s ease;
      border-radius: 3px;
    }

    #fill-energy { background: #ff5252; }
    #fill-stamina { background: #ffca28; }
    #fill-mental { background: #42a5f5; }

    /* 子どもでもわかる総合げんきメーター */
    .kids-gauge {
      background: rgba(255, 255, 255, 0.9);
      color: #222;
      padding: 6px 10px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    }

    #kids-face {
      font-size: 24px;
      line-height: 1;
    }

    .kids-bar-wrap {
      flex: 1;
    }

    .kids-text-row {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      font-weight: bold;
      color: #444;
      margin-bottom: 2px;
    }

    .kids-bar-bg {
      background: #e0e0e0;
      height: 10px;
      border-radius: 5px;
      overflow: hidden;
    }

    #kids-bar-fill {
      background: linear-gradient(90deg, #ff9800, #4caf50);
      height: 100%;
      width: 100%;
      border-radius: 5px;
      transition: width 0.3s ease;
    }

    /* 下部：思考欄エリア（通信結果のみを表示） */
    #thought-area {
      flex: 1;
      background: #182230;
      border-top: 3px solid #2a3b50;
      padding: 16px;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }

    .thought-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .thought-title {
      font-size: 13px;
      font-weight: bold;
      color: #90caf9;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    #network-badge {
      font-size: 10px;
      padding: 3px 8px;
      border-radius: 10px;
      background: #37474f;
      color: #b0bec5;
      font-weight: bold;
    }

    #network-badge.online {
      background: #1b5e20;
      color: #a5d6a7;
    }

    #network-badge.error {
      background: #b71c1c;
      color: #ffcdd2;
    }

    /* 大きな思考テキスト表示窓 */
    #thought-bubble {
      flex: 1;
      background: #222f3e;
      border-radius: 16px;
      padding: 16px;
      border: 2px solid #34495e;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      box-shadow: inset 0 2px 6px rgba(0,0,0,0.3);
    }

    #thought-text {
      font-size: 1.35rem;
      font-weight: bold;
      line-height: 1.5;
      color: #ffffff;
      word-break: break-word;
    }

    /* フッター：通信ボタン */
    #footer-bar {
      height: 72px;
      background: #121820;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-top: 1px solid #222f3e;
    }

    #talk-btn {
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #29b6f6, #0288d1);
      border: none;
      border-radius: 14px;
      color: #ffffff;
      font-size: 18px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(2, 136, 209, 0.4);
      transition: transform 0.1s, opacity 0.2s;
    }

    #talk-btn:active {
      transform: scale(0.98);
    }

    #talk-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* 設定小窓（モーダル）：初期状態は必ず非表示 */
    #settings-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(4px);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-card {
      background: #1e293b;
      width: 100%;
      max-width: 360px;
      border-radius: 20px;
      padding: 20px;
      border: 1px solid #334155;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
    }

    .modal-title {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 14px;
      text-align: center;
      color: #f1f5f9;
    }

    .modal-label {
      font-size: 12px;
      color: #94a3b8;
      margin-bottom: 6px;
      display: block;
    }

    .modal-input {
      width: 100%;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 10px;
      color: #fff;
      font-size: 14px;
      margin-bottom: 16px;
      outline: none;
    }

    .modal-btn-row {
      display: flex;
      gap: 10px;
      margin-top: 8px;
    }

    .modal-btn {
      flex: 1;
      padding: 12px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: bold;
      border: none;
      cursor: pointer;
    }

    .btn-save { background: #10b981; color: #fff; }
    .btn-close { background: #475569; color: #fff; }
  </style>

  <!-- 3D表示ライブラリ Three.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <!-- 上半分：3Dプレビュー画面 -->
  <div id="view-container">
    <div id="hud">
      <!-- コアの3つが横に並ぶゲージ -->
      <div class="core-gauges">
        <div class="gauge-col">
          <div class="gauge-label"><span>🍎 エナジー</span><span id="txt-energy">100</span></div>
          <div class="bar-bg"><div id="fill-energy" class="bar-fill"></div></div>
        </div>
        <div class="gauge-col">
          <div class="gauge-label"><span>⚡ スタミナ</span><span id="txt-stamina">100</span></div>
          <div class="bar-bg"><div id="fill-stamina" class="bar-fill"></div></div>
        </div>
        <div class="gauge-col">
          <div class="gauge-label"><span>💖 メンタル</span><span id="txt-mental">100</span></div>
          <div class="bar-bg"><div id="fill-mental" class="bar-fill"></div></div>
        </div>
      </div>

      <!-- 子どもでもわかる総合げんきメーター -->
      <div class="kids-gauge">
        <div id="kids-face">😊</div>
        <div class="kids-bar-wrap">
          <div class="kids-text-row">
            <span>げんき度</span>
            <span id="kids-status-txt">まんぷく・元気いっぱい！</span>
          </div>
          <div class="kids-bar-bg">
            <div id="kids-bar-fill"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- 右上：設定ボタン -->
    <button id="settings-btn" onclick="openSettings()">⚙️</button>

    <!-- 3D水槽キャンバス -->
    <canvas id="canvas3d"></canvas>
  </div>

  <!-- 下半分：思考結果の表示欄（通信成功結果のみ） -->
  <div id="thought-area">
    <div class="thought-header">
      <div class="thought-title">
        <span>💭</span>
        <span>AI思考通信</span>
      </div>
      <div id="network-badge">未接続</div>
    </div>
    <div id="thought-bubble">
      <div id="thought-text">下のボタンを押して、AIの思考と行動を受信してください</div>
    </div>
  </div>

  <!-- フッター：通信ボタン -->
  <div id="footer-bar">
    <button id="talk-btn" onclick="triggerThoughtCommunication()">
      <span>🧠</span>
      <span>AI思考通信を受信する</span>
    </button>
  </div>

  <!-- 設定小窓（モーダル）※初期状態は非表示 -->
  <div id="settings-modal">
    <div class="modal-card">
      <div class="modal-title">⚙️ せってい</div>
      
      <label class="modal-label">Gemini APIキー (gemini-3.8-flash)</label>
      <input type="password" id="api-key-input" class="modal-input" placeholder="AI Studioのキーを貼り付け">

      <label class="modal-label">セーブデータ（復活の呪文）</label>
      <input type="text" id="save-data-input" class="modal-input" placeholder="セーブデータコード">

      <div class="modal-btn-row">
        <button class="modal-btn btn-save" onclick="saveSettings()">ほぞん</button>
        <button class="modal-btn btn-close" onclick="closeSettings()">とじる</button>
      </div>
    </div>
  </div>

  <script>
    /* ============================================================
       【完全密閉・永久保存版】生命の種 コアエンジン (LifeCore)
       ============================================================ */
    class LifeCore {
      #energy = 100;
      #stamina = 100;
      #mental = 100;
      #isAlive = true;

      #memory = {};
      #lastStateKey = null;
      #lastAction = null;
      #lastWellbeing = 100;
      #lastDelta = 0;

      constructor(savedData = null) {
        if (savedData) this.importSave(savedData);
        else this.#lastWellbeing = this.#calculateWellbeing();
        Object.freeze(this);
      }

      #calculateWellbeing() {
        if (!this.#isAlive) return 0;
        return (this.#energy * 0.5) + (this.#stamina * 0.3) + (this.#mental * 0.2);
      }

      #determineCurrentDrive() {
        if (this.#energy <= 0) return 'DEAD';
        if (this.#stamina <= 0) return 'FAINT';
        if (this.#energy <= 30) return 'STARVING';
        if (this.#stamina <= 25) return 'EXHAUSTED';
        if (this.#energy <= 60) return 'HUNGRY';
        if (this.#mental <= 30) return 'BORED';
        return 'PEACE';
      }

      tickNaturalDecay() {
        if (!this.#isAlive) return 'NONE';
        this.#energy = Math.max(0, this.#energy - 1);
        this.#stamina = Math.max(0, this.#stamina - 1);
        this.#mental = Math.max(0, this.#mental - 1);

        if (this.#energy <= 0) {
          this.#isAlive = false;
          return 'DEAD';
        }
        return this.#determineCurrentDrive();
      }

      applyAIAction(actionName) {
        if (!this.#isAlive) return;

        this.#lastStateKey = this.#determineCurrentDrive();
        this.#lastAction = actionName;
        this.#lastWellbeing = this.#calculateWellbeing();

        if (actionName === 'EAT') {
          this.feedback(35, 5, 10);
        } else if (actionName === 'SLEEP') {
          this.feedback(-1, 30, 5);
        } else if (actionName === 'PLAY') {
          this.feedback(-3, -5, 25);
        } else if (actionName === 'WALK') {
          this.feedback(-2, -3, 8);
        } else if (actionName === 'WAIT') {
          this.feedback(0, 5, -5);
        }
      }

      feedback(dEnergy = 0, dStamina = 0, dMental = 0) {
        if (!this.#isAlive) return;

        this.#energy = Math.min(100, Math.max(0, this.#energy + dEnergy));
        this.#stamina = Math.min(100, Math.max(0, this.#stamina + dStamina));
        this.#mental = Math.min(100, Math.max(0, this.#mental + dMental));

        if (this.#energy <= 0) this.#isAlive = false;

        const newWellbeing = this.#calculateWellbeing();
        const reward = newWellbeing - this.#lastWellbeing;
        this.#lastDelta = Number(reward.toFixed(2));

        if (this.#lastStateKey && this.#lastAction) {
          if (!this.#memory[this.#lastStateKey]) this.#memory[this.#lastStateKey] = {};
          const currentScore = this.#memory[this.#lastStateKey][this.#lastAction] || 0;
          this.#memory[this.#lastStateKey][this.#lastAction] = Number((currentScore + reward).toFixed(2));
        }
      }

      getState() {
        return Object.freeze({
          isAlive: this.#isAlive,
          energy: this.#energy,
          stamina: this.#stamina,
          mental: this.#mental,
          drive: this.#determineCurrentDrive(),
          lastAction: this.#lastAction,
          feelingDelta: this.#lastDelta,
          memory: JSON.parse(JSON.stringify(this.#memory))
        });
      }

      exportSave() {
        return JSON.stringify({
          e: this.#energy,
          s: this.#stamina,
          m: this.#mental,
          a: this.#isAlive,
          mem: this.#memory
        });
      }

      importSave(jsonString) {
        try {
          const data = JSON.parse(jsonString);
          this.#energy = data.e ?? 100;
          this.#stamina = data.s ?? 100;
          this.#mental = data.m ?? 100;
          this.#isAlive = data.a ?? true;
          this.#memory = data.mem ?? {};
          this.#lastWellbeing = this.#calculateWellbeing();
        } catch (e) {
          console.error(e);
        }
      }
    }
    Object.freeze(LifeCore);

    /* ============================================================
       3D世界（Three.js）とゲーム全体の管理
       ============================================================ */
    const core = new LifeCore();
    let geminiApiKey = localStorage.getItem('GEMINI_API_KEY') || '';

    let scene, camera, renderer;
    let creatureGroup, appleGroup;
    let appleExists = true;
    let appleRespawnTimer = 0;

    let targetX = 0;
    let targetZ = 0;
    let isMoving = false;
    let isSleeping = false;
    let currentAIAction = 'WAIT';
    const applePosition = { x: 3.5, y: 0.5, z: 0 };

    function init3D() {
      const container = document.getElementById('view-container');
      const canvas = document.getElementById('canvas3d');

      scene = new THREE.Scene();
      scene.background = new THREE.Color(0xd7f3fe);

      camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
      camera.position.set(0, 10, 14);
      camera.lookAt(0, 0, 0);

      renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
      renderer.setSize(container.clientWidth, container.clientHeight);
      renderer.shadowMap.enabled = true;

      const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 0.9);
      scene.add(hemiLight);

      const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
      dirLight.position.set(5, 15, 7);
      dirLight.castShadow = true;
      scene.add(dirLight);

      // 地面：ハシゴなし・地下は土で完全に埋まった空間
      const topGeo = new THREE.BoxGeometry(14, 0.4, 10);
      const topMat = new THREE.MeshLambertMaterial({ color: 0x55aa44 });
      const topGrass = new THREE.Mesh(topGeo, topMat);
      topGrass.position.y = -0.2;
      topGrass.receiveShadow = true;
      scene.add(topGrass);

      const soilGeo = new THREE.BoxGeometry(14, 4, 10);
      const soilMat = new THREE.MeshLambertMaterial({ color: 0x6e4a2e });
      const soilBase = new THREE.Mesh(soilGeo, soilMat);
      soilBase.position.y = -2.4;
      soilBase.receiveShadow = true;
      scene.add(soilBase);

      // 地上のりんご 1つ
      appleGroup = new THREE.Group();
      const fruitGeo = new THREE.SphereGeometry(0.5, 16, 16);
      const fruitMat = new THREE.MeshLambertMaterial({ color: 0xe53935 });
      const fruit = new THREE.Mesh(fruitGeo, fruitMat);
      fruit.castShadow = true;
      appleGroup.add(fruit);

      const stemGeo = new THREE.CylinderGeometry(0.04, 0.04, 0.3, 8);
      const stemMat = new THREE.MeshLambertMaterial({ color: 0x4e342e });
      const stem = new THREE.Mesh(stemGeo, stemMat);
      stem.position.y = 0.55;
      appleGroup.add(stem);

      const leafGeo = new THREE.BoxGeometry(0.25, 0.05, 0.15);
      const leafMat = new THREE.MeshLambertMaterial({ color: 0x43a047 });
      const leaf = new THREE.Mesh(leafGeo, leafMat);
      leaf.position.set(0.12, 0.58, 0);
      leaf.rotation.z = 0.3;
      appleGroup.add(leaf);

      appleGroup.position.set(applePosition.x, applePosition.y, applePosition.z);
      scene.add(appleGroup);

      // AIキャラクター
      creatureGroup = new THREE.Group();
      const bodyGeo = new THREE.SphereGeometry(0.7, 16, 16);
      const bodyMat = new THREE.MeshLambertMaterial({ color: 0xffd54f });
      const body = new THREE.Mesh(bodyGeo, bodyMat);
      body.position.y = 0.7;
      body.castShadow = true;
      creatureGroup.add(body);

      const eyeGeo = new THREE.SphereGeometry(0.08, 8, 8);
      const eyeMat = new THREE.MeshBasicMaterial({ color: 0x212121 });
      const leftEye = new THREE.Mesh(eyeGeo, eyeMat);
      leftEye.position.set(0.25, 0.85, 0.6);
      const rightEye = new THREE.Mesh(eyeGeo, eyeMat);
      rightEye.position.set(-0.25, 0.85, 0.6);
      creatureGroup.add(leftEye);
      creatureGroup.add(rightEye);

      const beakGeo = new THREE.ConeGeometry(0.18, 0.3, 8);
      const beakMat = new THREE.MeshLambertMaterial({ color: 0xff7043 });
      const beak = new THREE.Mesh(beakGeo, beakMat);
      beak.rotation.x = Math.PI / 2;
      beak.position.set(0, 0.7, 0.75);
      creatureGroup.add(beak);

      creatureGroup.position.set(-3, 0, 0);
      scene.add(creatureGroup);

      window.addEventListener('resize', onWindowResize);
    }

    function onWindowResize() {
      const container = document.getElementById('view-container');
      camera.aspect = container.clientWidth / container.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(container.clientWidth, container.clientHeight);
    }

    /* ============================================================
       ゲームループ（時間経過とAIが決定した行動のアニメーション）
       ============================================================ */
    let stepCount = 0;

    function gameLoop() {
      stepCount++;

      // 時間経過による基本消費（5秒ごと）
      if (stepCount % 150 === 0) {
        core.tickNaturalDecay();
      }

      // りんごのリスポーン管理
      if (!appleExists) {
        appleRespawnTimer++;
        if (appleRespawnTimer > 250) {
          appleExists = true;
          appleGroup.visible = true;
          appleRespawnTimer = 0;
        }
      }

      // AIが下した指示の動きを3Dで実行
      updateCreatureMovement();
      updateHUD();

      renderer.render(scene, camera);
      requestAnimationFrame(gameLoop);
    }

    // AIが決定した行動を実行する関数（通信結果が直接ここに反映される）
    function applyAIJudgement(action, emotion) {
      currentAIAction = action;

      if (action === 'SLEEP') {
        isSleeping = true;
        isMoving = false;
        core.applyAIAction('SLEEP');
      } else if (action === 'EAT' && appleExists) {
        isSleeping = false;
        targetX = applePosition.x - 0.8;
        targetZ = applePosition.z;
        isMoving = true;
      } else if (action === 'PLAY') {
        isSleeping = false;
        targetX = (Math.random() - 0.5) * 8;
        targetZ = (Math.random() - 0.5) * 5;
        isMoving = true;
        core.applyAIAction('PLAY');
      } else if (action === 'WALK') {
        isSleeping = false;
        targetX = (Math.random() - 0.5) * 8;
        targetZ = (Math.random() - 0.5) * 5;
        isMoving = true;
        core.applyAIAction('WALK');
      } else {
        isSleeping = false;
        isMoving = false;
        core.applyAIAction('WAIT');
      }
    }

    function updateCreatureMovement() {
      if (isSleeping) {
        creatureGroup.scale.set(1.1, 0.65, 1.1);
        creatureGroup.position.y = 0;
        return;
      }
      creatureGroup.scale.set(1, 1, 1);

      if (isMoving) {
        const dx = targetX - creatureGroup.position.x;
        const dz = targetZ - creatureGroup.position.z;
        const dist = Math.sqrt(dx * dx + dz * dz);

        if (dist > 0.1) {
          creatureGroup.position.x += (dx / dist) * 0.07;
          creatureGroup.position.z += (dz / dist) * 0.07;
          creatureGroup.rotation.y = Math.atan2(dx, dz);
          creatureGroup.position.y = Math.abs(Math.sin(stepCount * 0.2)) * 0.3;
        } else {
          isMoving = false;
          creatureGroup.position.y = 0;

          // りんごに到着して食べる処理
          if (currentAIAction === 'EAT' && appleExists && Math.abs(creatureGroup.position.x - targetX) < 0.2) {
            appleExists = false;
            appleGroup.visible = false;
            core.applyAIAction('EAT');
            currentAIAction = 'WAIT';
            updateHUD();
          }
        }
      }
    }

    function updateHUD() {
      const state = core.getState();

      document.getElementById('txt-energy').innerText = state.energy;
      document.getElementById('txt-stamina').innerText = state.stamina;
      document.getElementById('txt-mental').innerText = state.mental;

      document.getElementById('fill-energy').style.width = state.energy + '%';
      document.getElementById('fill-stamina').style.width = state.stamina + '%';
      document.getElementById('fill-mental').style.width = state.mental + '%';

      const totalScore = Math.round((state.energy + state.stamina + state.mental) / 3);
      document.getElementById('kids-bar-fill').style.width = totalScore + '%';

      const faceEl = document.getElementById('kids-face');
      const statusTxt = document.getElementById('kids-status-txt');

      if (!state.isAlive) {
        faceEl.innerText = '🪦';
        statusTxt.innerText = 'たおれてしまいました…';
      } else if (state.stamina <= 0 || isSleeping) {
        faceEl.innerText = '💤';
        statusTxt.innerText = 'ぐっすり おやすみ中…';
      } else if (state.energy <= 30) {
        faceEl.innerText = '😭';
        statusTxt.innerText = 'おなかペコペコ！';
      } else if (state.mental <= 30) {
        faceEl.innerText = '🥺';
        statusTxt.innerText = 'たいくつで あそびたいな';
      } else if (totalScore > 75) {
        faceEl.innerText = '😆';
        statusTxt.innerText = 'まんぷく・元気いっぱい！';
      } else {
        faceEl.innerText = '😊';
        statusTxt.innerText = 'ふつうに のんびり中';
      }
    }

    /* ============================================================
       【通信最優先】Gemini 3.8 Flash 通信実行部
       ・作り置きメッセージの完全排除
       ・AIが思考と次の行動を判断し、ゲームに直接反映
       ============================================================ */
    async function triggerThoughtCommunication() {
      const talkBtn = document.getElementById('talk-btn');
      const textEl = document.getElementById('thought-text');
      const badge = document.getElementById('network-badge');
      const state = core.getState();

      if (!state.isAlive) {
        badge.innerText = '生命停止';
        badge.className = 'error';
        textEl.innerText = '【通信不可】生命エネルギーがゼロです。思考を受信できません。';
        return;
      }

      if (!geminiApiKey) {
        badge.innerText = '未設定';
        badge.className = 'error';
        textEl.innerText = '【通信エラー】APIキーがありません。\n右上の⚙️から Gemini APIキー を設定してください。';
        return;
      }

      talkBtn.disabled = true;
      badge.innerText = '通信中...';
      badge.className = '';
      textEl.innerText = 'AIと思考を通信中…意思決定を受信しています…';

      // 利用可能な行動のリスト
      const availableOptions = ['SLEEP', 'PLAY', 'WALK', 'WAIT'];
      if (appleExists) availableOptions.push('EAT');

      const prompt = `
あなたは箱庭に住む小さな生き物の脳です。
身体の状態:
- エナジー(満腹度): ${state.energy}/100
- スタミナ(体力): ${state.stamina}/100
- メンタル(楽しさ): ${state.mental}/100
- いまの欲求: ${state.drive}
- 環境: りんごが地上に${appleExists ? '1つあります' : 'いまはありません'}。

選択可能な行動: ${JSON.stringify(availableOptions)}
(意味: EAT=りんごを食べる, SLEEP=寝る, PLAY=あそぶ, WALK=ウロウロ散歩, WAIT=ぼーっと待つ)

以下のJSONフォーマットのみを返してください。前置きやMarkdownの装飾は一切含めないでください。
{
  "thought": "いま心の中でつぶやいたこと（子どもでも読めるやさしい言葉で1〜2文、大文字で表示するため短く）",
  "action": "選択可能な行動から1つ選んだ英語",
  "emotion": "HAPPY, ANGRY, SAD, TIRED, NORMAL のいずれか"
}
`;

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=${geminiApiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: prompt }] }],
            generationConfig: {
              responseMimeType: "application/json"
            }
          })
        });

        if (!response.ok) {
          throw new Error(`HTTP通信エラー: コード ${response.status}`);
        }

        const data = await response.json();
        const jsonText = data.candidates?.[0]?.content?.parts?.[0]?.text?.trim();

        if (!jsonText) throw new Error('AIからのデータが空でした');

        const aiDecision = JSON.parse(jsonText);

        // 通信成功：AIが考えた思考と決定した行動をゲームに即時反映
        badge.innerText = '通信成功 (gemini-3.8-flash)';
        badge.className = 'online';
        textEl.innerText = `「${aiDecision.thought}」`;

        // AIの判断結果を行動として反映させる
        applyAIJudgement(aiDecision.action, aiDecision.emotion);
        updateHUD();

      } catch (err) {
        console.error(err);
        badge.innerText = '通信エラー';
        badge.className = 'error';
        textEl.innerText = `【通信エラー】\nAIからの思考・行動を受信できませんでした。\n通信環境とAPIキーを確認してください。`;
      } finally {
        talkBtn.disabled = false;
      }
    }

    /* ============================================================
       設定モーダル画面の開閉・保存
       ============================================================ */
    function openSettings() {
      document.getElementById('api-key-input').value = geminiApiKey;
      document.getElementById('save-data-input').value = core.exportSave();
      document.getElementById('settings-modal').style.display = 'flex';
    }

    function closeSettings() {
      document.getElementById('settings-modal').style.display = 'none';
    }

    function saveSettings() {
      const keyVal = document.getElementById('api-key-input').value.trim();
      const saveVal = document.getElementById('save-data-input').value.trim();

      geminiApiKey = keyVal;
      localStorage.setItem('GEMINI_API_KEY', keyVal);

      if (saveVal) {
        core.importSave(saveVal);
        updateHUD();
      }

      closeSettings();
    }

    window.onload = () => {
      init3D();
      gameLoop();
    };
  </script>
</body>
</html>
