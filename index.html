<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ボクセルAI自律思考水槽</title>
  <style>
    /* ベースリセット＆フォント */
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    body { margin: 0; overflow: hidden; background-color: #0f172a; font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', Meiryo, sans-serif; }

    /* 3Dキャンバス */
    #canvas-container { width: 100vw; height: 100vh; display: block; }

    /* UI全体レイヤー（星空見上げで透明になる） */
    #ui-layer { transition: opacity 0.4s ease; }
    #ui-layer.hidden { opacity: 0; pointer-events: none; }

    /* 上部ステータスパネル */
    #status-panel {
      position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
      width: 95%; max-width: 400px; background: rgba(255, 255, 255, 0.95);
      border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      padding: 10px 12px; z-index: 10;
    }
    
    /* 3本ゲージのレイアウト */
    .gauge-container { display: flex; justify-content: space-between; gap: 6px; }
    .gauge-box {
      flex: 1; background: #f8fafc; border: 1px solid #e2e8f0;
      border-radius: 8px; padding: 4px; text-align: center;
    }
    .gauge-title { font-size: 10px; font-weight: bold; color: #475569; margin-bottom: 2px; }
    .gauge-bar-bg { width: 100%; height: 6px; background: #cbd5e1; border-radius: 4px; overflow: hidden; }
    .bar-fill { height: 100%; border-radius: 4px; transition: width 0.35s ease; }
    
    /* ゲージ色 */
    #bar-life { background: #ef4444; }     /* おなか (命) */
    #bar-stamina { background: #eab308; }  /* たいりょく (体) */
    #bar-mental { background: #10b981; }   /* ごきげん (心) */

    /* 下部ステータス行（左右潰れ防止フレックス） */
    .robot-status-row {
      display: flex; justify-content: space-between; align-items: center;
      margin-top: 6px; padding-top: 5px; border-top: 1px solid #e2e8f0;
      gap: 6px; flex-wrap: wrap;
    }
    .status-left-group { display: flex; align-items: center; gap: 6px; flex-shrink: 1; min-width: 0; flex-wrap: wrap; }
    .status-right-group { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }

    /* 各種バッジ・文字 */
    .robot-id-tag { font-size: 11.5px; font-weight: 900; color: #334155; line-height: 1.2; white-space: nowrap; }
    .badge {
      font-size: 10px; font-weight: bold; padding: 2px 6px; border-radius: 12px;
      display: flex; align-items: center; justify-content: center; gap: 2px; white-space: nowrap;
    }
    .badge-days { background: #dcfce7; color: #166534; }
    .badge-time { background: #e0f2fe; color: #075985; }
    .badge-mood { background: #fef08a; color: #854d0e; }
    .btn-icon {
      width: 24px; height: 24px; border-radius: 50%; background: #e2e8f0;
      display: flex; justify-content: center; align-items: center;
      font-size: 14px; cursor: pointer; border: none; flex-shrink: 0;
    }

    /* 日記帳アイコン（位置調整） */
    #diary-btn {
      position: absolute; top: 136px; right: 10px;
      width: 44px; height: 44px; background: white; border-radius: 50%;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2); display: flex;
      justify-content: center; align-items: center; font-size: 24px; z-index: 10; cursor: pointer;
    }

    /* ボトムパネル（思考・メッセージ） */
    #bottom-panel {
      position: absolute; bottom: 0; left: 0; width: 100%;
      background: white; border-top-left-radius: 20px; border-top-right-radius: 20px;
      box-shadow: 0 -4px 20px rgba(0,0,0,0.15); padding: 15px; z-index: 10;
      display: flex; flex-direction: column; gap: 10px;
    }
    .panel-header { display: flex; justify-content: space-between; align-items: center; font-size: 12px; font-weight: bold; color: #64748b; }
    .ai-badge { background: #eff6ff; color: #2563eb; padding: 2px 8px; border-radius: 10px; font-size: 10px; display: flex; align-items: center; gap: 4px; }
    #message-box {
      background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px;
      padding: 10px; font-size: 14px; color: #334155; min-height: 60px;
      max-height: 100px; overflow-y: auto; line-height: 1.4;
    }
    .action-history { font-size: 10px; color: #94a3b8; display: flex; justify-content: space-between; align-items: center; }
    .btn-think {
      background: #3b82f6; color: white; border: none; border-radius: 12px;
      padding: 12px; font-size: 16px; font-weight: bold; text-align: center;
      box-shadow: 0 4px 0 #2563eb; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 8px;
    }
    .btn-think:active { transform: translateY(4px); box-shadow: 0 0 0 #2563eb; }

    /* フローティングボタン */
    #gacha-btn {
      position: absolute; bottom: 180px; left: 50%; transform: translateX(-50%);
      width: 50px; height: 50px; background: white; border-radius: 50%;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2); display: flex;
      justify-content: center; align-items: center; font-size: 24px; z-index: 5; cursor: pointer;
    }

    /* 通知トースト */
    #toast {
      position: absolute; bottom: 190px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.7); color: white; padding: 8px 16px;
      border-radius: 20px; font-size: 12px; font-weight: bold;
      opacity: 0; pointer-events: none; transition: opacity 0.3s; z-index: 100;
    }

    /* モーダル群 (初期非表示) */
    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(15,23,42,0.8); z-index: 50;
      display: flex; justify-content: center; align-items: center;
      opacity: 0; pointer-events: none; transition: opacity 0.3s;
    }
    .modal-overlay.active { opacity: 1; pointer-events: auto; }
    .modal-content {
      background: white; width: 90%; max-width: 360px; max-height: 80vh;
      border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 15px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3); position: relative; overflow-y: auto;
    }
    .modal-close {
      position: absolute; top: 15px; right: 15px; font-size: 18px; color: #94a3b8; cursor: pointer;
    }
    .modal-title { font-size: 16px; font-weight: bold; color: #1e293b; text-align: center; }
    
    /* ガチャ演出用 */
    .capsule-machine { font-size: 80px; text-align: center; margin: 10px 0; }
    .capsule-result { font-size: 50px; text-align: center; animation: pop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); display: none; }
    @keyframes pop { 0% { transform: scale(0); } 100% { transform: scale(1); } }
    .btn-gacha-spin {
      background: #ec4899; color: white; border: none; padding: 12px; border-radius: 8px;
      font-weight: bold; font-size: 16px; box-shadow: 0 4px 0 #be185d; cursor: pointer;
    }
    .btn-gacha-spin:active { transform: translateY(4px); box-shadow: 0 0 0 #be185d; }
    
    /* 設定系 */
    .setting-group { margin-bottom: 10px; }
    .setting-label { font-size: 12px; font-weight: bold; color: #475569; margin-bottom: 4px; display: block; }
    .setting-input { width: 100%; padding: 8px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 12px; }
    .btn-save { background: #3b82f6; color: white; border: none; padding: 10px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; }
    .btn-danger { background: #ef4444; color: white; border: none; padding: 10px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 10px; }
  </style>
</head>
<body>

<div id="canvas-container"></div>

<div id="ui-layer">
  <!-- 上部ステータス -->
  <div id="status-panel">
    <div class="gauge-container">
      <div class="gauge-box">
        <div class="gauge-title">🍎 おなか <span id="val-life">100</span></div>
        <div class="gauge-bar-bg"><div class="bar-fill" id="bar-life" style="width:100%"></div></div>
      </div>
      <div class="gauge-box">
        <div class="gauge-title">⚡ たいりょく <span id="val-stamina">100</span></div>
        <div class="gauge-bar-bg"><div class="bar-fill" id="bar-stamina" style="width:100%"></div></div>
      </div>
      <div class="gauge-box">
        <div class="gauge-title">🎵 ごきげん <span id="val-mental">100</span></div>
        <div class="gauge-bar-bg"><div class="bar-fill" id="bar-mental" style="width:100%"></div></div>
      </div>
    </div>
    <div class="robot-status-row">
      <div class="status-left-group">
        <div class="robot-id-tag" id="ui-robot-id">🤖 ロボ1ごう</div>
        <div class="badge badge-days" id="ui-days">🌱 1日目</div>
        <div class="badge badge-time" id="ui-time">☀️ 朝</div>
      </div>
      <div class="status-right-group">
        <div class="badge badge-mood" id="ui-mood">😊 あんしん・まんぷく</div>
        <button class="btn-icon" id="btn-settings">⚙️</button>
      </div>
    </div>
  </div>

  <div id="diary-btn">📖</div>
  <div id="gacha-btn">+</div>

  <!-- 下部操作パネル -->
  <div id="bottom-panel">
    <div class="panel-header">
      <span>💭 ロボのきもち・心のさけび</span>
      <div class="ai-badge" id="ai-status">💤 待機中</div>
    </div>
    <div id="message-box">ここは世界の果て。四角い大地のまわりを丸い海が包み込み、白い波しぶきを立てながら外の滝へと流れ落ちているよ。泡立つ滝のずっと下には、この世界を支える古代遺跡のカメさんが眠っているんだって！</div>
    <div class="action-history">
      <span id="history-action">👟 やった事：待機中（まだ動いていないよ）</span>
      <span id="history-loc" style="color:#3b82f6; font-weight:bold;">中央静止中</span>
    </div>
    <button class="btn-think" id="btn-action">⚡ 今すぐ考える</button>
  </div>
</div>

<div id="toast">💾 データを保存したよ</div>

<!-- モーダル: 設定 -->
<div class="modal-overlay" id="modal-settings" style="display: none;">
  <div class="modal-content">
    <div class="modal-close" onclick="closeModal('modal-settings')">✕</div>
    <div class="modal-title">⚙️ システム設定</div>
    <div class="setting-group">
      <label class="setting-label">🤖 使うAIの頭脳を選ぶ</label>
      <select id="setting-ai-type" class="setting-input">
        <option value="none">🌱 アルゴンさん (通信なし・サクサク)</option>
        <option value="groq">🟪 Groq (1日1000回無料・爆速)</option>
        <option value="gemini">🟦 Gemini 3.8 (表現力豊か・1日20回)</option>
      </select>
    </div>
    <div class="setting-group">
      <label class="setting-label">🟪 Groq APIキー (gsk_...)</label>
      <input type="text" id="setting-groq-key" class="setting-input" placeholder="キーを貼り付け">
    </div>
    <div class="setting-group">
      <label class="setting-label">🟦 Gemini APIキー (AIzaSy...)</label>
      <input type="text" id="setting-gemini-key" class="setting-input" placeholder="キーを貼り付け">
    </div>
    <button class="btn-save" onclick="saveSettings()">設定をほぞんして閉じる</button>
    <hr style="border:0; border-top:1px solid #e2e8f0; margin:5px 0;">
    <button class="btn-danger" onclick="resetGameDirectly()">🔄 データを消して最初からやり直す (初期化)</button>
  </div>
</div>

<!-- モーダル: ガチャ -->
<div class="modal-overlay" id="modal-gacha" style="display: none;">
  <div class="modal-content">
    <div class="modal-close" onclick="closeModal('modal-gacha')">✕</div>
    <div class="modal-title">🎰 アイテムガチャ</div>
    <div class="capsule-machine" id="gacha-machine">🕹️</div>
    <div class="capsule-result" id="gacha-result"></div>
    <button class="btn-gacha-spin" id="btn-spin">ガチャを回す (🎵ごきげん回復)</button>
    <div style="font-size:10px; color:#64748b; text-align:center;">島に 🍎・🪨・草 がランダムに落ちるよ！</div>
  </div>
</div>

<!-- Three.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<script>
  // ==========================================
  // 1. LifeCore (生命と本能のコア)
  // ==========================================
  class LifeCore {
    constructor(saveData = null) {
      if (saveData) {
        this.energy = saveData.energy; this.stamina = saveData.stamina; this.mental = saveData.mental;
        this.memory = saveData.memory || {};
      } else {
        this.energy = 100; this.stamina = 100; this.mental = 100;
        this.memory = {};
      }
    }
    tick(actionType = 'IDLE') {
      this.energy = Math.max(0, this.energy - (actionType==='MOVE'?10:5));
      this.stamina = Math.max(0, this.stamina - (actionType==='MOVE'?10:5));
      if(actionType === 'REST') this.stamina = Math.min(100, this.stamina + 30);
      if(actionType === 'EAT') this.energy = Math.min(100, this.energy + 50);
      
      if(actionType === 'IDLE' || actionType === 'SAME') this.mental = Math.max(0, this.mental - 10);
      if(actionType === 'PLAY' || actionType === 'NEW') this.mental = Math.min(100, this.mental + 30);

      return this.getState();
    }
    getState() {
      let mode = 'PEACE';
      if(this.energy <= 0) mode = 'DEAD';
      else if(this.energy < 30) mode = 'STARVING';
      else if(this.stamina < 20) mode = 'EXHAUSTED';
      else if(this.mental < 30) mode = 'BORED';
      return { energy: this.energy, stamina: this.stamina, mental: this.mental, mode: mode };
    }
    exportSave() { return { energy: this.energy, stamina: this.stamina, mental: this.mental, memory: this.memory }; }
  }

  // ==========================================
  // 2. セーブデータと状態管理
  // ==========================================
  const safeStorage = {
    getItem(key) { try { return localStorage.getItem(key); } catch(e) { return null; } },
    setItem(key, val) { try { localStorage.setItem(key, val); } catch(e) {} },
    removeItem(key) { try { localStorage.removeItem(key); } catch(e) {} }
  };

  let life = new LifeCore();
  let GAME_DAY = 1;
  let TIME_STEP = 0; // 0~19 (20手で1日)
  
  // 5x5マス、各マス5細分化 (0~4)。中心は2。
  let ROBOT = {
    gen: 1,
    pos: { x: 0, z: 0, sx: 2, sz: 2 }, 
    height: 1,
    speed: 3
  };
  let pendingLoadedObjs = null; // ロードしたアイテムを後で配置

  function tryLoadWorldState() {
    try {
      const data = JSON.parse(safeStorage.getItem('island_game_save_v4')); 
      if (!data || !data.lifeSave) return false;
      
      life = new LifeCore(data.lifeSave); 
      Object.assign(ROBOT, data.robot); 
      GAME_DAY = data.day || 1;
      TIME_STEP = data.time || 0;

      // 🚨 安全装置：古いセーブのクラッシュ防止
      if (typeof ROBOT.pos.sx === 'undefined') { ROBOT.pos.sx = 2; ROBOT.pos.sz = 2; }
      if (typeof ROBOT.speed === 'undefined') ROBOT.speed = 3;

      pendingLoadedObjs = Array.isArray(data.objs) ? data.objs : null;
      return true;
    } catch (e) { return false; }
  }
  function saveWorldState() {
    const objs = [];
    scene.children.forEach(c => {
      if(c.userData && c.userData.isItem) {
        objs.push({ type: c.userData.type, x: c.userData.gx, z: c.userData.gz });
      }
    });
    const data = { lifeSave: life.exportSave(), robot: ROBOT, objs: objs, day: GAME_DAY, time: TIME_STEP };
    safeStorage.setItem('island_game_save_v4', JSON.stringify(data));
  }
  function resetGameDirectly() {
    safeStorage.removeItem('island_game_save_v4');
    location.reload();
  }

  // ==========================================
  // 3. 3Dシーン構築 (デザイン完全固定)
  // ==========================================
  const scene = new THREE.Scene();
  // 空の色は時間帯で変えるため後で updateEnvironment() で処理
  scene.background = new THREE.Color(0x0f172a); 
  
  const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
  camera.position.set(8, 8, 8);
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true;
  document.getElementById('canvas-container').appendChild(renderer.domElement);

  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.05;
  controls.maxDistance = 25;
  // ★見上げカメラ解放
  controls.maxPolarAngle = Math.PI - 0.1; 

  // ★UIフェードアウト監視
  controls.addEventListener('change', () => {
    const angle = controls.getPolarAngle();
    const uiLayer = document.getElementById('ui-layer');
    if (angle > Math.PI / 2 + 0.1) {
      uiLayer.classList.add('hidden');
    } else {
      uiLayer.classList.remove('hidden');
    }
  });

  const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
  scene.add(ambientLight);
  const dirLight = new THREE.DirectionalLight(0xffddaa, 0.8);
  dirLight.position.set(5, 10, 2);
  dirLight.castShadow = true;
  scene.add(dirLight);

  // --- 大地 (5x5) ---
  const gridSize = 5;
  const blockGeo = new THREE.BoxGeometry(1, 1, 1);
  const grassMat = new THREE.MeshLambertMaterial({ color: 0x86efac });
  const soilMat = new THREE.MeshLambertMaterial({ color: 0xa8a29e });
  const blockGroup = new THREE.Group();
  scene.add(blockGroup);

  for(let x = -2; x <= 2; x++){
    for(let z = -2; z <= 2; z++){
      const m = new THREE.Mesh(blockGeo, grassMat);
      m.position.set(x, -0.5, z);
      m.receiveShadow = true; m.castShadow = true;
      blockGroup.add(m);
      const b = new THREE.Mesh(blockGeo, soilMat);
      b.position.set(x, -1.5, z);
      b.receiveShadow = true;
      blockGroup.add(b);
    }
  }

  // --- 海と滝 (固定デザイン) ---
  const seaGeo = new THREE.CircleGeometry(5.2, 32);
  seaGeo.rotateX(-Math.PI / 2);
  const seaMat = new THREE.MeshPhongMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.8, shininess: 100 });
  const sea = new THREE.Mesh(seaGeo, seaMat);
  sea.position.y = -0.8;
  scene.add(sea);

  // 滝テクスチャ作成
  const wfCanvas = document.createElement('canvas');
  wfCanvas.width = 256; wfCanvas.height = 512;
  const ctx = wfCanvas.getContext('2d');
  ctx.fillStyle = '#38bdf8'; ctx.fillRect(0,0,256,512);
  for(let i=0; i<100; i++){
    ctx.fillStyle = `rgba(255,255,255,${Math.random()*0.5})`;
    ctx.fillRect(Math.random()*256, Math.random()*512, 2, Math.random()*50+10);
  }
  const wfTex = new THREE.CanvasTexture(wfCanvas);
  wfTex.wrapS = THREE.RepeatWrapping; wfTex.wrapT = THREE.RepeatWrapping;

  const waterfallGeo = new THREE.CylinderGeometry(5.2, 5.2, 8, 32, 1, true);
  const waterfallMat = new THREE.MeshBasicMaterial({ map: wfTex, transparent: true, opacity: 0.8, side: THREE.DoubleSide });
  const waterfall = new THREE.Mesh(waterfallGeo, waterfallMat);
  waterfall.position.y = -4.8;
  scene.add(waterfall);

  const foamRingGeo = new THREE.RingGeometry(4.8, 5.6, 32);
  foamRingGeo.rotateX(-Math.PI / 2);
  const foamMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.6, side: THREE.DoubleSide });
  const foamRingMesh = new THREE.Mesh(foamRingGeo, foamMat);
  foamRingMesh.position.y = -8.7;
  scene.add(foamRingMesh);

  // 雲海
  const cloudGeo = new THREE.PlaneGeometry(30, 30);
  cloudGeo.rotateX(-Math.PI / 2);
  const cloudMat = new THREE.MeshBasicMaterial({ color: 0xf1f5f9, transparent: true, opacity: 0.7 });
  const cloud = new THREE.Mesh(cloudGeo, cloudMat);
  cloud.position.y = -8.5;
  scene.add(cloud);

  // --- 古代カメ (サンドストーン色) ---
  function buildTurtle() {
    const tGroup = new THREE.Group();
    const tMat = new THREE.MeshLambertMaterial({ color: 0xdac292 }); // サンドストーン
    // 甲羅
    const shell = new THREE.Mesh(new THREE.BoxGeometry(4, 1.5, 5), tMat);
    shell.position.y = 0.75;
    tGroup.add(shell);
    // 頭
    const head = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1, 1.5), tMat);
    head.position.set(0, 0.5, 3);
    tGroup.add(head);
    // ヒレ
    const flipperGeo = new THREE.BoxGeometry(2, 0.3, 1.5);
    const pos = [[2.5, 0.2, 1.5], [-2.5, 0.2, 1.5], [2.5, 0.2, -1.5], [-2.5, 0.2, -1.5]];
    pos.forEach(p => {
      const f = new THREE.Mesh(flipperGeo, tMat);
      f.position.set(p[0], p[1], p[2]);
      tGroup.add(f);
    });
    tGroup.position.y = -10.5; // 滝壺の下
    return tGroup;
  }
  const turtle = buildTurtle();
  scene.add(turtle);

  // --- 星空ドームとリング ---
  const starDomeGeo = new THREE.SphereGeometry(24, 32, 32);
  const starDomeMat = new THREE.MeshBasicMaterial({ color: 0x000000, side: THREE.BackSide, transparent: true, opacity: 0 });
  const starDomeMesh = new THREE.Mesh(starDomeGeo, starDomeMat);
  scene.add(starDomeMesh);

  const starGeo = new THREE.BufferGeometry();
  const starVertices = [];
  for(let i=0; i<320; i++){
    const v = new THREE.Vector3().randomDirection().multiplyScalar(23);
    starVertices.push(v.x, v.y, v.z);
  }
  starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starVertices, 3));
  const starMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.15, transparent: true, opacity: 0 });
  const starPoints = new THREE.Points(starGeo, starMat);
  scene.add(starPoints);

  const celestialRings = new THREE.Group();
  for(let i=0; i<3; i++){
    const rGeo = new THREE.TorusGeometry(22 + i, 0.05, 8, 64);
    const rMat = new THREE.MeshBasicMaterial({ color: 0xfef08a, transparent: true, opacity: 0 });
    const ring = new THREE.Mesh(rGeo, rMat);
    ring.rotation.x = Math.random() * Math.PI;
    ring.rotation.y = Math.random() * Math.PI;
    celestialRings.add(ring);
  }
  scene.add(celestialRings);

  // --- ロボット ---
  const robotGroup = new THREE.Group();
  const bodyMat = new THREE.MeshLambertMaterial({ color: 0x60a5fa });
  const headMat = new THREE.MeshLambertMaterial({ color: 0xbfdbfe });
  const eyeMat = new THREE.MeshBasicMaterial({ color: 0x1e293b });
  
  const body = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.5, 0.3), bodyMat);
  body.position.y = 0.25; body.castShadow = true;
  robotGroup.add(body);
  const head = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.4, 0.4), headMat);
  head.position.y = 0.7; head.castShadow = true;
  robotGroup.add(head);
  const eyeL = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.1, 0.05), eyeMat);
  eyeL.position.set(-0.1, 0.75, 0.2);
  robotGroup.add(eyeL);
  const eyeR = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.1, 0.05), eyeMat);
  eyeR.position.set(0.1, 0.75, 0.2);
  robotGroup.add(eyeR);
  
  // 電球
  const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.08), new THREE.MeshBasicMaterial({color: 0xfbbf24}));
  bulb.position.y = 0.95;
  robotGroup.add(bulb);
  scene.add(robotGroup);

  // ==========================================
  // 4. ゲームロジック
  // ==========================================
  function updateUI() {
    const st = life.getState();
    document.getElementById('val-life').innerText = st.energy;
    document.getElementById('bar-life').style.width = st.energy + '%';
    document.getElementById('val-stamina').innerText = st.stamina;
    document.getElementById('bar-stamina').style.width = st.stamina + '%';
    document.getElementById('val-mental').innerText = st.mental;
    document.getElementById('bar-mental').style.width = st.mental + '%';

    document.getElementById('ui-robot-id').innerText = `🤖 ロボ${ROBOT.gen}ごう`;
    document.getElementById('ui-days').innerText = `🌱 ${GAME_DAY}日目`;
    
    let timeStr = '☀️ 朝';
    if(TIME_STEP > 4) timeStr = '☀️ 昼';
    if(TIME_STEP > 8) timeStr = '🌇 夕方';
    if(TIME_STEP > 12) timeStr = '🌙 夜';
    if(TIME_STEP > 16) timeStr = '🌌 夜中';
    document.getElementById('ui-time').innerText = timeStr;

    let moodStr = '😊 あんしん';
    if(st.mode==='STARVING') moodStr = '😵 はらぺこ';
    else if(st.mode==='EXHAUSTED') moodStr = '😴 ねむい';
    else if(st.mode==='BORED') moodStr = '😐 たいくつ';
    else if(st.mode==='DEAD') moodStr = '👼 ちからつきる';
    document.getElementById('ui-mood').innerText = moodStr;
  }

  function updateEnvironment() {
    // 星空と空の色の制御
    let skyColor = new THREE.Color(0x38bdf8); // 昼
    let starOpacity = 0;
    
    if (TIME_STEP > 8 && TIME_STEP <= 12) { // 夕方
      skyColor = new THREE.Color(0xfb923c);
      starOpacity = 0.1;
    } else if (TIME_STEP > 12 && TIME_STEP <= 16) { // 夜
      skyColor = new THREE.Color(0x1e3a8a);
      starOpacity = 0.6;
    } else if (TIME_STEP > 16) { // 深淵
      skyColor = new THREE.Color(0x020617);
      starOpacity = 1.0;
    }
    
    scene.background = skyColor;
    starPoints.material.opacity = starOpacity;
    celestialRings.children.forEach(r => r.material.opacity = starOpacity * 0.5);
  }

  function placeItem(type, x, z) {
    let mesh;
    if(type === 'apple'){
      mesh = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.4, 0.4), new THREE.MeshLambertMaterial({color: 0xef4444}));
      const leaf = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.1, 0.1), new THREE.MeshBasicMaterial({color: 0x22c55e}));
      leaf.position.y = 0.25; mesh.add(leaf);
    } else if(type === 'stone'){
      mesh = new THREE.Mesh(new THREE.DodecahedronGeometry(0.25), new THREE.MeshLambertMaterial({color: 0x94a3b8}));
    } else {
      mesh = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.5, 0.3), new THREE.MeshLambertMaterial({color: 0x4ade80}));
    }
    mesh.position.set(x, 0.2, z);
    mesh.userData = { isItem: true, type: type, gx: x, gz: z };
    scene.add(mesh);
  }

  function renderRobotPos() {
    // 1マスは幅1。sx,sz(0~4)を -0.4 ~ +0.4 にマッピング
    const offsetX = (ROBOT.pos.sx - 2) * 0.2;
    const offsetZ = (ROBOT.pos.sz - 2) * 0.2;
    // やや浮かせる
    robotGroup.position.set(ROBOT.pos.x + offsetX, 0, ROBOT.pos.z + offsetZ);
  }

  // 初期化
  if(!tryLoadWorldState()) {
    saveWorldState();
  } else if(pendingLoadedObjs) {
    pendingLoadedObjs.forEach(o => placeItem(o.type, o.x, o.z));
    pendingLoadedObjs = null;
  }
  renderRobotPos();
  updateUI();
  updateEnvironment();

  // モーダル管理
  function openModal(id) { document.getElementById(id).style.display = 'flex'; setTimeout(()=> document.getElementById(id).classList.add('active'), 10); }
  function closeModal(id) { document.getElementById(id).classList.remove('active'); setTimeout(()=> document.getElementById(id).style.display='none', 300); }
  
  document.getElementById('btn-settings').onclick = () => openModal('modal-settings');
  document.getElementById('gacha-btn').onclick = () => openModal('modal-gacha');
  
  // ガチャ処理
  document.getElementById('btn-spin').onclick = () => {
    document.getElementById('gacha-machine').innerText = '🔄';
    document.getElementById('gacha-result').style.display = 'none';
    setTimeout(() => {
      const items = ['🍎', '🪨', '🌿'];
      const types = ['apple', 'stone', 'grass'];
      const r = Math.floor(Math.random()*3);
      document.getElementById('gacha-machine').innerText = '🕹️';
      const res = document.getElementById('gacha-result');
      res.innerText = items[r];
      res.style.display = 'block';
      
      const ex = Math.floor(Math.random()*5)-2;
      const ez = Math.floor(Math.random()*5)-2;
      placeItem(types[r], ex, ez);
      
      life.tick('PLAY');
      updateUI();
      saveWorldState();
    }, 800);
  };

  // AI設定と通信モック
  function saveSettings() {
    safeStorage.setItem('ai_type', document.getElementById('setting-ai-type').value);
    safeStorage.setItem('api_groq', document.getElementById('setting-groq-key').value);
    safeStorage.setItem('api_gemini', document.getElementById('setting-gemini-key').value);
    closeModal('modal-settings');
    showToast('設定を保存したよ');
  }
  document.getElementById('setting-ai-type').value = safeStorage.getItem('ai_type') || 'none';
  document.getElementById('setting-groq-key').value = safeStorage.getItem('api_groq') || '';
  document.getElementById('setting-gemini-key').value = safeStorage.getItem('api_gemini') || '';

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.innerText = msg; t.style.opacity = 1;
    setTimeout(()=> t.style.opacity = 0, 2000);
  }

  // 思考ボタン
  document.getElementById('btn-action').onclick = () => {
    const btn = document.getElementById('btn-action');
    btn.disabled = true;
    bulb.material.color.setHex(0xf87171); // 考え中赤
    document.getElementById('ai-status').innerText = '⚡ 思考中...';
    
    // 時間経過
    TIME_STEP++;
    if(TIME_STEP > 19) { TIME_STEP = 0; GAME_DAY++; }
    
    // ダミーの思考ウェイト (アルゴンさん・またはAPI通信待ち)
    setTimeout(() => {
      // 動作: ランダムに隣へ (端は超えない)
      const dirs = [[1,0],[-1,0],[0,1],[0,-1]];
      const d = dirs[Math.floor(Math.random()*dirs.length)];
      let nx = ROBOT.pos.x + d[0];
      let nz = ROBOT.pos.z + d[1];
      if(nx >= -2 && nx <= 2 && nz >= -2 && nz <= 2) {
        ROBOT.pos.x = nx; ROBOT.pos.z = nz;
        ROBOT.pos.sx = 2; ROBOT.pos.sz = 2; // 中央へ
        life.tick('MOVE');
        document.getElementById('history-action').innerText = '👟 やった事：あるいた';
      } else {
        life.tick('IDLE'); // 端で立ち止まる
        document.getElementById('history-action').innerText = '👟 やった事：やすんだ';
      }
      
      // アイテム回収判定
      const toRemove = [];
      scene.children.forEach(c => {
        if(c.userData && c.userData.isItem && c.userData.gx === ROBOT.pos.x && c.userData.gz === ROBOT.pos.z) {
          if(c.userData.type === 'apple') life.tick('EAT');
          toRemove.push(c);
        }
      });
      toRemove.forEach(c => scene.remove(c));

      renderRobotPos();
      updateUI();
      updateEnvironment();
      saveWorldState();

      if(life.energy <= 0) {
        document.getElementById('message-box').innerText = 'おなかがすいて、たおれてしまった... 次の世代へバトンタッチします。';
        setTimeout(() => {
          safeStorage.removeItem('island_game_save_v4');
          ROBOT.gen++; // 世代交代
          const newData = { robot: { gen: ROBOT.gen, pos: {x:0,z:0,sx:2,sz:2}, speed:3 } };
          safeStorage.setItem('island_game_save_v4', JSON.stringify(newData));
          location.reload();
        }, 3000);
        return;
      }

      document.getElementById('message-box').innerText = 'うーん、次はどこへ行こうかな？おなかのぐあいは悪くないよ！';
      bulb.material.color.setHex(0xfbbf24);
      document.getElementById('ai-status').innerText = '💤 待機中';
      btn.disabled = false;
    }, 600);
  };

  // --- アニメーションループ ---
  const clock = new THREE.Clock();
  function animate() {
    requestAnimationFrame(animate);
    const dt = clock.getDelta();
    const t = clock.getElapsedTime();

    controls.update();

    // 滝と海の自然な動き
    waterfallMat.map.offset.y += 0.006;
    sea.position.y = -0.8 + Math.sin(t * 1.5) * 0.05;
    
    // カメの呼吸アニメーション
    turtle.position.y = -10.5 + Math.sin(t * 0.8) * 0.2;
    turtle.children.forEach((child, i) => {
      if(i >= 2) child.rotation.z = Math.sin(t * 2 + i) * 0.2; // ヒレをパタパタ
    });

    // 天球のゆっくりした回転
    celestialRings.rotation.x += 0.001;
    celestialRings.rotation.y += 0.002;
    starDomeMesh.rotation.y -= 0.0005;

    // ロボットの軽い息づかい
    robotGroup.children[0].scale.y = 1 + Math.sin(t * 4) * 0.03;

    renderer.render(scene, camera);
  }
  animate();

  // リサイズ対応
  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
</script>
</body>
</html>
