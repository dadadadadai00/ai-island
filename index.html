<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>キャラクター骨組みテスト</title>
  <style>
    * { box-sizing: border-box; user-select: none; margin: 0; padding: 0; }
    body {
      background: #12131a; color: #eee; font-family: sans-serif;
      display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 12px;
    }
    h2 { font-size: 15px; color: #818cf8; margin-bottom: 8px; }

    /* ステージ台座（斜め立体） */
    .stage {
      width: 220px; height: 180px; position: relative;
      display: flex; align-items: center; justify-content: center;
      perspective: 600px; margin-bottom: 12px;
    }
    .pedestal {
      width: 140px; height: 140px; background: #222538;
      border: 3px solid #3b4261; border-radius: 20px;
      transform: rotateX(60deg) rotateZ(-45deg);
      box-shadow: 0 10px 0 #181926, 0 20px 25px rgba(0,0,0,0.5);
    }
    .shadow {
      position: absolute; bottom: 35px; width: 60px; height: 24px;
      background: rgba(0,0,0,0.4); border-radius: 50%;
      filter: blur(2px); transition: all 0.2s;
    }

    /* キャラクター本体 */
    .chara-root {
      position: absolute; bottom: 45px; width: 64px; height: 80px;
      display: flex; flex-direction: column; align-items: center;
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    /* 向き（4方向の反転・角度） */
    .dir-front-left { transform: scaleX(1); }
    .dir-front-right { transform: scaleX(-1); }
    .dir-back-left { transform: scaleX(1) scaleY(0.95); filter: brightness(0.85); }
    .dir-back-right { transform: scaleX(-1) scaleY(0.95); filter: brightness(0.85); }

    /* 各スロットの構造 */
    .slot-hat { position: absolute; top: -18px; font-size: 24px; z-index: 10; transition: transform 0.15s; }
    .head {
      width: 48px; height: 42px; background: linear-gradient(135deg, #60a5fa, #3b82f6);
      border-radius: 14px; position: relative; display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 0 #1d4ed8; z-index: 5;
    }
    .slot-face { font-size: 20px; }
    .body {
      width: 38px; height: 32px; background: linear-gradient(135deg, #e2e8f0, #cbd5e1);
      border-radius: 10px; margin-top: -4px; position: relative;
      box-shadow: 0 3px 0 #94a3b8; z-index: 4;
    }
    .slot-right-hand {
      position: absolute; left: -14px; top: 6px; font-size: 20px;
      transform-origin: top right; z-index: 6;
    }
    .slot-backpack { position: absolute; right: -12px; top: 4px; font-size: 20px; z-index: 2; }

    /* 仕草アニメーション */
    .act-idle { animation: animIdle 2s ease-in-out infinite; }
    .act-walk { animation: animWalk 0.4s ease-in-out infinite alternate; }
    .act-panic { animation: animPanic 0.15s ease-in-out infinite alternate; }
    .act-sleep { transform: rotate(85deg) translate(20px, -20px) !important; }

    @keyframes animIdle {
      0%, 100% { transform: translateY(0) scale(1, 1); }
      50% { transform: translateY(-4px) scale(0.98, 1.02); }
    }
    @keyframes animWalk {
      0% { transform: translateY(0) rotate(-6deg); }
      100% { transform: translateY(-8px) rotate(6deg); }
    }
    @keyframes animPanic {
      0% { transform: translateY(-8px) scale(1.1, 0.9); }
      100% { transform: translateY(-16px) scale(0.9, 1.1) rotate(4deg); }
    }

    /* コントロールパネル */
    .controls {
      width: 100%; max-width: 360px; background: #1a1b26;
      border: 1px solid #2e334a; border-radius: 12px; padding: 12px;
      display: flex; flex-direction: column; gap: 8px; font-size: 12px;
    }
    .control-row { display: flex; align-items: center; justify-content: space-between; }
    .btn-group { display: flex; gap: 4px; }
    .c-btn {
      padding: 6px 9px; background: #24283b; border: 1px solid #414868;
      color: #cfc9c2; border-radius: 6px; font-size: 11px; cursor: pointer;
    }
    .c-btn.active { background: #3d59a1; border-color: #7aa2f7; color: #fff; font-weight: bold; }
  </style>
</head>
<body>

  <h2>🤖 キャラクター表現テスト</h2>

  <div class="stage">
    <div class="pedestal"></div>
    <div class="shadow" id="shadow"></div>
    <div class="chara-root dir-front-left act-idle" id="chara">
      <div class="slot-hat" id="slotHat">🍃</div>
      <div class="head">
        <div class="slot-face" id="slotFace">👀</div>
      </div>
      <div class="body">
        <div class="slot-right-hand" id="slotHand">🍎</div>
        <div class="slot-backpack" id="slotBack">🎒</div>
      </div>
    </div>
  </div>

  <div class="controls">
    <div class="control-row">
      <span>🧭 むき</span>
      <div class="btn-group">
        <button class="c-btn active" onclick="setDir('front-left', this)">手前左</button>
        <button class="c-btn" onclick="setDir('front-right', this)">手前右</button>
        <button class="c-btn" onclick="setDir('back-left', this)">奥左</button>
        <button class="c-btn" onclick="setDir('back-right', this)">奥右</button>
      </div>
    </div>

    <div class="control-row">
      <span>🎭 しぐさ</span>
      <div class="btn-group">
        <button class="c-btn active" onclick="setAct('idle', this)">待機</button>
        <button class="c-btn" onclick="setAct('walk', this)">歩行</button>
        <button class="c-btn" onclick="setAct('panic', this)">あわて</button>
        <button class="c-btn" onclick="setAct('sleep', this)">睡眠</button>
      </div>
    </div>

    <div class="control-row">
      <span>😀 ひょうじょう</span>
      <div class="btn-group">
        <button class="c-btn active" onclick="setFace('👀', this)">通常</button>
        <button class="c-btn" onclick="setFace('😱', this)">恐怖</button>
        <button class="c-btn" onclick="setFace('😵', this)">疲労</button>
        <button class="c-btn" onclick="setFace('😴', this)">眠気</button>
      </div>
    </div>

    <div class="control-row">
      <span>👒 あたま装備</span>
      <div class="btn-group">
        <button class="c-btn active" onclick="setHat('🍃', this)">はっぱ</button>
        <button class="c-btn" onclick="setHat('👑', this)">王冠</button>
        <button class="c-btn" onclick="setHat('🧢', this)">ぼうし</button>
        <button class="c-btn" onclick="setHat('', this)">なし</button>
      </div>
    </div>

    <div class="control-row">
      <span>🍎 もちもの</span>
      <div class="btn-group">
        <button class="c-btn active" onclick="setHand('🍎', this)">リンゴ</button>
        <button class="c-btn" onclick="setHand('🔥', this)">たいまつ</button>
        <button class="c-btn" onclick="setHand('🪵', this)">木の棒</button>
        <button class="c-btn" onclick="setHand('', this)">なし</button>
      </div>
    </div>
  </div>

  <script>
    const chara = document.getElementById('chara');
    let currentDir = 'dir-front-left';
    let currentAct = 'act-idle';

    function setDir(dir, btn) {
      chara.classList.remove(currentDir);
      currentDir = `dir-${dir}`;
      chara.classList.add(currentDir);
      setActive(btn);
    }

    function setAct(act, btn) {
      chara.classList.remove(currentAct);
      currentAct = `act-${act}`;
      chara.classList.add(currentAct);
      setActive(btn);
    }

    function setFace(icon, btn) {
      document.getElementById('slotFace').innerText = icon;
      setActive(btn);
    }

    function setHat(icon, btn) {
      document.getElementById('slotHat').innerText = icon;
      setActive(btn);
    }

    function setHand(icon, btn) {
      document.getElementById('slotHand').innerText = icon;
      setActive(btn);
    }

    function setActive(btn) {
      btn.parentElement.querySelectorAll('.c-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }
  </script>
</body>
</html>
